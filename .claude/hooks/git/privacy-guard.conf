# Privacy guard settings - installed by install-git-hooks.ps1, read by privacy-lib.sh and by the installer itself.
# One owner for each value both sides need (R0): edit it here, never as a literal in a script.
#
# min_term_length: shortest deny-list term kept, in characters. A shorter fragment of a
#   name matches ordinary words. Provenance: chosen by the operator on 2026-10-12 (PR #71
#   first commit), previously a literal 4 in both the installer and the hook. Overridden by
#   `git config privacyguard.minTermLength`, which the hook reads per repository and the
#   installer reads from the global configuration.
min_term_length=4
