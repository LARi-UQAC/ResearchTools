# Generated by build/build_kit.py. An edit to this copy inside the kit is discarded at the next build; the copy setup.ps1 installs into your home is yours to edit.
#
# Aider - global configuration.
#
# This is the ONE file that has to sit here: aider finds it by name at the home
# directory, then at the git root, then in the working directory, and merges the
# three so a project can override the machine. Measured 2026-09-02: AIDER_CONFIG
# does NOT relocate it - only the --config flag does - so everything else was
# moved into ~/.config/aider/ and is named from here.
#
# Written 2026-09-02.

## Model ------------------------------------------------------------------
# The main coder. 27.3B Q4_K_M at its native 262144 window, resident for good.
# The TUNED tag. The base tag stays installed, but running it would use a
# 262144 window, which measured ZERO layers on a 6 GB card. See
# CONFIG_OLLAMA.md, and re-run aider-ollama-config.py to retune.
model: ollama_chat/qwen3.8-aider

# The REVIEWER tag, untuned, and it bakes the huge window this file warns about
#   three lines above. It is the auditor, not a safe alternative coder:  aider --model ollama_chat/gemma4:31b-maxctx
model-settings-file: {{HOME}}/.config/aider/model-settings.yml

# The daemon address, exported into aider's own environment, so no shell profile
# and no registry entry is needed.
set-env:
  - OLLAMA_API_BASE=http://127.0.0.1:11434

## Always-on context ------------------------------------------------------
# Read-only, so aider can never rewrite its own rules. conventions.md is the
# working protocol; rules.md is generated from the repository's rule files by
# aider-rules-sync.py and is not edited by hand.
read:
  - {{HOME}}/.config/aider/conventions.md
  - {{HOME}}/.config/aider/rules.md

## Repo map ---------------------------------------------------------------
# 4096 rather than the 1024 default, and it is HALF aider's own 8192 ceiling on
# the map, deliberately: a thin map is why a local model edits a file it never
# saw, and the other half of that ceiling is left for everything else the prompt
# has to carry. The window is 65536 on the tuned tag, not the architecture's
# 262144, so the map IS part of what is scarce - which is the opposite of what
# this comment used to say.
map-tokens: 4096

## Git --------------------------------------------------------------------
# Commits are allowed, but only on a branch. Both hooks are PER REPOSITORY, in
# that repository's own .git/hooks/: pre-commit refuses main and master, and
# pre-push refuses pushing to them. Never a global core.hooksPath - git honours
# it when resolving --git-path too, so a delegating hook re-runs itself and
# hangs the commit until it is killed, which the manual's failure-mode table
# records as measured. install-hooks.ps1 puts them in an existing repository.
#
# Aider itself never pushes, never merges and never opens a pull request, so
# the human merge gate after a pull request is structural rather than a
# setting.
auto-commits: true
attribute-author: true
attribute-committer: true

## Do not act beyond what was asked ---------------------------------------
auto-lint: false
auto-test: false
