    (groups[key] = groups[key] || []).push(node);
  });
  var half = function (node) { return (vertical ? node.w : node.h) / 2; };
  Object.keys(groups).forEach(function (key) {
    var nodes = groups[key].sort(function (a, b) {
      return a[freeAxis] - b[freeAxis];
    });
    nodes.forEach(function (node, index) {
      var lowest = index === 0
        ? half(node) + 2
        : nodes[index - 1][freeAxis] + half(nodes[index - 1]) + LANE_GAP
          + half(node);
      if (node[freeAxis] < lowest) {
        node[freeAxis] = lowest;
        node.v = 0;
      }
    });
    var last = nodes[nodes.length - 1];
    var overflow = last[freeAxis] + half(last) + 2 - freeSpan;
    if (overflow > 0) {
      nodes.forEach(function (node) {
        node[freeAxis] = Math.max(half(node) + 2, node[freeAxis] - overflow);
      });
    }
  });
}

function drawGraph(graph, svg, width, height, vertical) {
  var parts = [];
  usedLanes(graph).forEach(function (lane) {
    var spec = (graph.plan || {})[lane];
    if (!spec) { return; }
    if (vertical) {
      parts.push('<text class="lane-label" x="2" y="'
        + (spec.centre - spec.extent / 2 - 5).toFixed(1) + '">'
        + LANE_NAMES[lane] + "</text>");
    } else {
      parts.push('<text class="lane-label" x="' + spec.centre.toFixed(1)
        + '" y="11" text-anchor="middle">' + LANE_NAMES[lane] + "</text>");
    }
  });

  graph.edges.forEach(function (edge) {
    var a = graph.nodes[edge.from];
    var b = graph.nodes[edge.to];
    var cls = "edge";
    if (edge.broken) { cls += " edge--alarm"; }
    else if (edge.kind !== "mirror") { cls += " edge--canonical"; }
    var path;
    if (vertical) {
      var my = (a.y + b.y) / 2;
      path = "M" + a.x.toFixed(1) + "," + a.y.toFixed(1)
        + " C" + a.x.toFixed(1) + "," + my.toFixed(1) + " "
        + b.x.toFixed(1) + "," + my.toFixed(1) + " "
        + b.x.toFixed(1) + "," + b.y.toFixed(1);
    } else {
      var mx = (a.x + b.x) / 2;
      path = "M" + a.x.toFixed(1) + "," + a.y.toFixed(1)
        + " C" + mx.toFixed(1) + "," + a.y.toFixed(1) + " "
        + mx.toFixed(1) + "," + b.y.toFixed(1) + " "
        + b.x.toFixed(1) + "," + b.y.toFixed(1);
    }
    parts.push('<path class="' + cls + '" d="' + path + '"/>');
    if (edge.broken) {
      parts.push('<text class="edge-label" x="' + ((a.x + b.x) / 2).toFixed(1)
        + '" y="' + ((a.y + b.y) / 2 - 4).toFixed(1)
        + '" text-anchor="middle">' + edge.broken + " lost</text>");
    }
  });

  graph.nodes.forEach(function (node) {
    var cls = "node";
    if (node.alarm) { cls += " node--alarm"; }
    if (node.absent) { cls += " node--absent"; }
    parts.push('<g class="' + cls + '">'
      + '<rect x="' + (node.x - node.w / 2).toFixed(1) + '" y="'
      + (node.y - node.h / 2).toFixed(1) + '" width="' + node.w
      + '" height="' + node.h + '"/>'
      + '<text x="' + node.x.toFixed(1) + '" y="' + (node.y + 3).toFixed(1)
      + '" text-anchor="middle">' + escapeText(node.label)
      + (node.count !== null && node.count !== undefined
          ? ' <tspan class="count">' + node.count + "</tspan>" : "")
      + "</text></g>");
  });

  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  svg.innerHTML = parts.join("");
}

function escapeText(text) {
  return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function canvasHeight(graph, vertical, measured, width) {
  if (!vertical) { return Math.max(180, measured); }
  /* Turned, the lanes are rows and a wrapped lane is several rows deep, so the
     height follows the plan rather than a guess. Planned twice on purpose: once
     to size the drawing, once to lay it out inside that size. */
  var plan = planLanes(graph, 10000, width, true);
  var total = usedLanes(graph).reduce(function (sum, lane) {
    return sum + plan[lane].extent + 34;
  }, 24);
  return Math.max(250, Math.round(total));
}

function graphShape(graph, width, height, vertical) {
  /* What counts as "the same diagram". Node identity and edge identity only:
     a colour, a count or an alarm changing must NOT move anything. */
  return [width, height, vertical,
          graph.nodes.map(function (n) { return n.id; }).join("|"),
          graph.edges.map(function (e) { return e.key; }).join("|")].join("//");
}

function solve(graph, width, height, vertical) {
  /* Run the whole simulation in one synchronous loop and keep only the result.
     Watching a solver converge is not information, and it was making the page
     unreadable. Stops early once the layout stops moving. */
  for (var i = 0; i < CFG.canvas.settle_ticks; i += 1) {
    if (tick(graph, width, height, vertical) <= CFG.canvas.min_alpha) {
      break;
    }
  }
}

function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); }

function tweenTo(graph, svg, width, height, vertical, from) {
  /* One eased move from the previous positions to the new ones. Exponential
     deceleration, no bounce, and exactly as long as the configured budget. */
  var target = {};
  graph.nodes.forEach(function (node) {
    target[node.id] = { x: node.x, y: node.y };
  });
  var start = null;
  var duration = CFG.canvas.settle_ms;
  sim.tweening = true;
  sim.tweenStart = window.performance.now();
  var frame = function (now) {
    if (start === null) { start = now; }
    var t = Math.min(1, (now - start) / duration);
    var eased = easeOutQuart(t);
    graph.nodes.forEach(function (node) {
      var was = from[node.id];
      var to = target[node.id];
      if (!was) {
        /* A node that did not exist before arrives where it belongs rather
           than flying in from somewhere it never was. */
        node.x = to.x;
        node.y = to.y;
        return;
      }
      node.x = was.x + (to.x - was.x) * eased;
      node.y = was.y + (to.y - was.y) * eased;
    });
    drawGraph(graph, svg, width, height, vertical);
    if (t < 1) {
      sim.raf = window.requestAnimationFrame(frame);
    } else {
      graph.nodes.forEach(function (node) {
        node.x = target[node.id].x;
        node.y = target[node.id].y;
      });
      sim.tweening = false;
      drawGraph(graph, svg, width, height, vertical);
    }
  };
  sim.raf = window.requestAnimationFrame(frame);
}

function renderCanvas(state) {
  var svg = document.getElementById("fanout");
  var box = svg.getBoundingClientRect();
  var width = Math.max(280, Math.round(box.width));
  var graph = buildGraph(state);
  if (!graph.nodes.length) {
    svg.innerHTML = '<text class="lane-label" x="12" y="24">'
      + "nothing to draw yet</text>";
    window.cancelAnimationFrame(sim.raf);
    sim.positions = null;
    sim.shape = null;
    sim.tweening = false;
    return;
  }
  var vertical = width < CFG.canvas.vertical_below_px;
  var height = canvasHeight(graph, vertical, Math.round(box.height), width);
  svg.style.height = height + "px";

  var shape = graphShape(graph, width, height, vertical);
  layout(graph, width, height, vertical);

  if (sim.positions && sim.shape === shape) {
    /* Same diagram as last poll. Hold every box exactly where it was and repaint
       only what the state says - which is the whole point: a still page means
       nothing moved, and a box that moves means something did.

       Unless a move is still in flight, in which case leave it alone. Measured
       2026-08-31: this function cancelled the pending frame unconditionally at
       the top, so the 2-second poll killed every tween before its FIRST frame
       ran and the diagram snapped to its destination instead of travelling
       there. A poll is not a reason to interrupt a movement it did not cause;
       the state it carries is at most one frame budget late. */
    if (sim.tweening
        && window.performance.now() - sim.tweenStart
           < CFG.canvas.settle_ms * 3) {
      return;
    }
    /* Bounded, because the flag alone can deadlock the panel. A browser stops
       serving animation frames to a tab it considers hidden or occluded, and a
       tween interrupted that way never reaches its final frame - so the flag
       stays set, every later poll returns here, and the canvas freezes for good
       while the rest of the page keeps updating. Measured 2026-08-31 in an
       automation context where an unrelated frame chain advanced once in 700ms.
       Past three times its own budget a movement is over, however few frames it
       actually got. */
    sim.tweening = false;
    graph.nodes.forEach(function (node) {
      var held = sim.positions[node.id];
      if (held) {
        node.x = held.x;
        node.y = held.y;
      }
    });
    drawGraph(graph, svg, width, height, vertical);
    return;
  }

  /* The shape genuinely changed, so a movement already under way is
     superseded: THIS is the only place a pending frame may be cancelled. */
  window.cancelAnimationFrame(sim.raf);
  sim.tweening = false;
  solve(graph, width, height, vertical);
  var from = sim.positions;
  sim.positions = {};
  graph.nodes.forEach(function (node) {
    sim.positions[node.id] = { x: node.x, y: node.y };
  });
  sim.shape = shape;

  if (!from || REDUCED) {
    /* First paint, or reduced motion: draw the settled layout outright. The
       panel's own entrance carries the arrival, so nothing starts life mid-
       simulation and reduced motion still gets the graph, settled. */
    drawGraph(graph, svg, width, height, vertical);
    return;
  }
  tweenTo(graph, svg, width, height, vertical, from);
}

/* ---- head, foot, poll ---------------------------------------------------- */
var lastState = null;

function renderHead(state) {
  var repo = state.repo_state || {};
  var live = document.getElementById("head-id");
  var id = stage();
  var name = (state.repo || {}).name || "repository";
  id.appendChild(el("b", null, name));
  var branch = (repo.branch || {}).value;
  var profile = (repo.profile || {}).value;
  if (branch) { id.appendChild(document.createTextNode(" . " + branch)); }
  if (profile) { id.appendChild(document.createTextNode(" . " + profile)); }
  morph(live, id);

  var verdict = document.getElementById("head-verdict");
  var mirrors = state.mirrors || {};
  var totals = mirrors.totals || {};
  var broken = (totals.lost || 0) + (totals.stale || 0) + (totals.orphan || 0);
  if (mirrors.status !== "ok") {
    verdict.className = "head-ok";
    txt(verdict, "matrix unavailable");
    return;
  }
  if (broken) {
    verdict.className = "head-alarm";
    txt(verdict, ["lost", "stale", "orphan"].filter(function (name) {
      return totals[name];
    }).map(function (name) {
      return totals[name] + " " + name;
    }).join(", "));
  } else {
    verdict.className = "head-ok";
    txt(verdict, "every mirror accounted for");
  }
}

function renderFoot(state) {
  var foot = document.getElementById("foot");
  var next = stage();
  var mirrors = state.mirrors || {};
  var manifest = mirrors.manifest || {};
  [["drawn by", "rt_state.py"],
   ["generated", clock(state.generated)],
   ["policy", (mirrors.policy_hash || "").slice(0, 8) || "-"],
   ["last install", manifest.status === "ok"
     ? clock(manifest.generated) + (manifest.personal_run ? " . personal" : "")
     : "not recorded"],
   ["root", (state.repo || {}).root || "-"]
  ].forEach(function (pair) {
    var box = el("div");
    box.appendChild(el("span", null, pair[0]));
    box.appendChild(el("b", "rc", pair[1]));
    next.appendChild(box);
  });
  if (manifest.status === "ok" && manifest.policy_matches === false) {
    var warn = el("div");
    warn.appendChild(el("span", null, "manifest"));
    warn.appendChild(el("b", "rc",
      "written under a different policy. Re-run install.ps1 -Manifest."));
    next.appendChild(warn);
  }
  morph(foot, next);
}

function render(state) {
  lastState = state;
  renderHead(state);
  renderMatrix(state);
  renderRail(state);
  renderFleet(state);
  renderCanvas(state);
  renderFoot(state);
}

function poll() {
  window.fetch("/api/state", { headers: { "Accept": "application/json" } })
    .then(function (response) { return response.json(); })
    .then(function (state) { render(state); })
    .catch(function (error) {
      /* Says what happened AND that it keeps trying, since the next poll is
         already scheduled below. Replacing the identity line outright made a
         transient failure look permanent. */
      var verdict = document.getElementById("head-verdict");
      verdict.className = "head-alarm";
      txt(verdict, "no answer from the server. Still polling.");
      if (window.console && window.console.warn) {
        window.console.warn("rt-observe poll failed", error);
      }
    })
    .then(function () { window.setTimeout(poll, CFG.poll_ms); });
}

var resizeTimer = 0;
window.addEventListener("resize", function () {
  window.clearTimeout(resizeTimer);
  resizeTimer = window.setTimeout(function () {
    if (lastState) { renderCanvas(lastState); }
  }, 160);
});

/* ---- theme ---------------------------------------------------------------
   `system` first, because handing the decision back to the machine has to stay
   reachable once a viewer has overridden it. Stamped on the root element, which
   both dark scopes in the token block are written to obey. */
var THEME_ORDER = ["system", "light", "dark"];
var THEME_KEY = "rt-observe-theme";

function storedTheme() {
  try {
    var saved = window.localStorage.getItem(THEME_KEY);
    return THEME_ORDER.indexOf(saved) === -1 ? "system" : saved;
  } catch (error) {
    /* A private window, cleared site data, or a browser set to block storage:
       reading throws rather than returning null. Follow the system and carry on
       - a theme control must never be able to break the page it sits on. */
    return "system";
  }
}

function applyTheme(name) {
  var root = document.documentElement;
  if (name === "system") {
    root.removeAttribute("data-theme");
  } else {
    root.setAttribute("data-theme", name);
  }
  var label = document.getElementById("theme-now");
  if (label) { label.textContent = name; }
  var button = document.getElementById("theme");
  if (button) {
    button.setAttribute(
      "aria-label",
      "Colour theme: " + name + ". Activate for "
      + THEME_ORDER[(THEME_ORDER.indexOf(name) + 1) % THEME_ORDER.length] + ".");
  }
  /* The canvas is drawn, not styled, so its colours come from the computed
     tokens at draw time. Redraw it after a switch or it keeps the old ink. */
  if (typeof lastState !== "undefined" && lastState) {
    sim.shape = null;
    renderCanvas(lastState);
  }
}

function cycleTheme() {
  var next = THEME_ORDER[(THEME_ORDER.indexOf(storedTheme()) + 1)
                         % THEME_ORDER.length];
  try {
    window.localStorage.setItem(THEME_KEY, next);
  } catch (error) {
    /* Not persisted, but still applied for this view. */
  }
  applyTheme(next);
}

document.getElementById("theme").addEventListener("click", cycleTheme);
applyTheme(storedTheme());

/* The whitelist is read ONCE at load and again after each run, never on the
   two-second poll: it costs a PATH lookup per action and it only changes when
   something on the machine does. */
loadCatalogue();
poll();
</script>
</body>
</html>
