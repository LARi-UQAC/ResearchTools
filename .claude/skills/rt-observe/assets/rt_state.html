  if (!button || button.hasAttribute("aria-hidden")) { return; }
  selectedName = button.dataset.name || null;
  renderDetail(selectedName);
});
document.addEventListener("animationend", function (event) {
  var cell = event.target.closest && event.target.closest(".cell--changed");
  if (cell) { cell.classList.remove("cell--changed"); }
});
document.addEventListener("click", function (event) {
  var button = event.target.closest && event.target.closest("[data-copy]");
  if (button) { copyText(button.getAttribute("data-copy"), button); }
});
document.getElementById("mx-filter").addEventListener("change", function () {
  if (lastState) { renderMatrix(lastState); }
});

/* ---- rail ---------------------------------------------------------------- */
function railPanel(title) {
  var panel = el("section", "rail-panel");
  panel.appendChild(el("h2", "rail-title", title));
  return panel;
}
function kv(panel, pairs) {
  var list = el("dl", "kv");
  pairs.forEach(function (pair) {
    if (pair[1] === null || pair[1] === undefined) { return; }
    list.appendChild(el("dt", null, pair[0]));
    list.appendChild(el("dd", pair[2] ? "bad" : null, pair[1]));
  });
  panel.appendChild(list);
}

function renderRepoPanel(state) {
  var panel = railPanel("Repository");
  var repo = state.repo_state || {};
  if (repo.status !== "ok") {
    unavailable(panel, "Repository unavailable", repo);
    return panel;
  }
  var green = repo.green || {};
  var suites = green.suites || {};
  var suiteText = green.value === "green"
    ? "green . " + (suites.passed || 0) + " passed"
      + (suites.not_run ? ", " + suites.not_run + " not run" : "")
    : green.value;
  kv(panel, [
    ["branch", (repo.branch || {}).value || (repo.branch || {}).reason],
    ["profile", (repo.profile || {}).value || (repo.profile || {}).reason],
    ["suite", suiteText, green.value !== "green"],
    ["stamp age", green.age_seconds !== undefined
      ? duration(green.age_seconds) + (green.aged ? " . aged" : "") : null,
     !!green.aged]
  ]);
  if (green.status !== "ok" && green.reason) {
    panel.appendChild(el("div", "unavail", green.reason));
  }
  var registry = state.registry || {};
  if (registry.status === "ok") {
    var counts = registry.counts || {};
    kv(panel, [
      ["definitions", counts.agents + " agents, " + counts.skills + " skills, "
        + counts.commands + " commands, " + counts.rules + " rules"],
      ["registry", registry.clean
        ? "well formed" + (registry.advisory_count
            ? " . " + registry.advisory_count + " advisories" : "")
        : registry.problem_count + " malformed", !registry.clean]
    ]);
  } else {
    unavailable(panel, "Registry unavailable", registry);
  }
  var block = el("div");
  titleBlock(block, [["proven by", green.proven_by || "-"],
                     ["stamped", clock(green.proven_at)]], !!green.aged);
  panel.appendChild(block);
  return panel;
}

function renderPlanPanel(state) {
  var panel = railPanel("Plan");
  var progress = state.progress || {};
  if (progress.status !== "ok") {
    unavailable(panel, "Plan unavailable", progress);
    return panel;
  }
  var list = el("ul", "phases");
  (progress.phases || []).forEach(function (phase) {
    var li = el("li");
    li.dataset.state = phase.state;
    li.dataset.detail = "phase";
    li.dataset.detailKey = String(phase.number);
    li.appendChild(el("span", "num", phase.number));
    var body = el("div");
    body.appendChild(el("span", "lbl",
      phase.label.replace(/^Phase \d+ - /, "")));
    body.appendChild(el("span", "st", phase.state));
    li.appendChild(body);
    list.appendChild(li);
  });
  panel.appendChild(list);
  if (progress.next_action) {
    var next = el("div", "next");
    next.appendChild(el("span", null, "next action"));
    next.appendChild(document.createTextNode(
      progress.next_action.split(". ")[0] + "."));
    panel.appendChild(next);
  }
  var cross = progress.crosscheck || {};
  if (cross.status === "ok" && !cross.agrees) {
    panel.appendChild(el("div", "unavail",
      "The plan and this file disagree: "
      + (cross.unreported || []).join(", ")));
  }
  var block = el("div");
  titleBlock(block, [["from", progress.file],
                     ["against", (cross.plan || "").split("/").pop()]], false);
  panel.appendChild(block);
  return panel;
}

function renderServicesPanel(state) {
  var panel = railPanel("Services");
  var services = state.services || {};
  if (services.status !== "ok") {
    unavailable(panel, "Services unavailable", services);
    return panel;
  }
  // MCP is its own snapshot section on its own, much longer timer: it is the
  // only probe here that leaves the machine. It is rendered in this panel
  // beside the two local daemons because that is where a reader looks for it,
  // but it arrives with its own receipt and refreshes on ttl_seconds.mcp_live.
  var mcp = state.mcp || {};
  if (mcp.status === "ok") {
    var counts = mcp.counts || {};
    kv(panel, [
      ["mcp", "tier " + mcp.tier + " . " + mcp.liveness],
      ["connected", counts.connected],
      ["needs auth", counts["needs-auth"]],
      ["failed", counts.failed, !!counts.failed]
    ]);
    if ((mcp.servers || []).length) {
      var list = el("ul", "srv-list");
      mcp.servers.forEach(function (server) {
        var li = el("li");
        li.appendChild(el("span", null, server.name));
        li.appendChild(el("span", "s-" + server.state, server.state));
        list.appendChild(li);
      });
      panel.appendChild(list);
    }
  } else {
    unavailable(panel, "MCP unavailable", mcp);
  }
  var models = services.local_models || {};
  var daemon = services.vault_daemon || {};
  var queue = daemon.queue || {};
  kv(panel, [
    ["models", models.status === "ok"
      ? (models.resident || []).map(function (m) { return m.tag; }).join(", ")
        || "none resident"
      : models.reason],
    ["vault daemon", daemon.status === "ok"
      ? (daemon.running ? "running" : "not running") : daemon.reason,
     daemon.status === "ok" && !daemon.running],
    ["queue", queue.raw !== undefined
      ? queue.raw + " raw, " + queue.working + " working, "
        + queue["needs-review"] + " to review" : null,
     !!queue["needs-review"]]
  ]);
  if (daemon.alert) { panel.appendChild(el("div", "unavail", daemon.alert)); }
  var block = el("div");
  titleBlock(block, receiptFor(state, "services"), false);
  panel.appendChild(block);
  return panel;
}

function renderGraphPanel(state) {
  var panel = railPanel("Code graph");
  var graph = state.graph || {};
  if (graph.status !== "ok") {
    unavailable(panel, "No snapshot", graph);
    if (graph.refresh) {
      var box = el("div", "dispatch", graph.refresh);
      panel.appendChild(box);
      var button = el("button", "btn", "Copy dispatch");
      button.type = "button";
      /* The payload rides on the node rather than in a closure: the reconciler
         may reuse this element between polls, and a listener bound to the node
         it replaced would either vanish or keep copying a stale string. */
      button.setAttribute("data-copy", graph.refresh);
      panel.appendChild(button);
    }
    return panel;
  }
  kv(panel, [
    ["nodes", graph.nodes],
    ["links", graph.links],
    ["origins", graph.origins ? Object.keys(graph.origins).join(", ") : null],
    ["freshness", graph.stale ? "stale" : "current", !!graph.stale]
  ]);
  var block = el("div");
  titleBlock(block, receiptFor(state, "graph"), !!graph.stale);
  panel.appendChild(block);
  return panel;
}

function renderHooksPanel(state) {
  var fleet = state.fleet || {};
  var claude = (fleet.harnesses || {}).claude_code;
  if (!claude || claude.status !== "ok" || !claude.hooks) { return null; }
  var panel = railPanel("Hooks");
  var hooks = claude.hooks;
  if (hooks.status !== "ok") {
    unavailable(panel, "Inventory unavailable", hooks);
    return panel;
  }
  var pre = el("pre", "hooks");
  (hooks.inventory || []).forEach(function (line) {
    pre.appendChild(el("b", null, line));
    pre.appendChild(document.createTextNode("\n"));
  });
  panel.appendChild(pre);
  var block = el("div");
  titleBlock(block, [["proven by", hooks.proven_by]], false);
  panel.appendChild(block);
  return panel;
}

function copyText(text, button) {
  var done = function () {
    var was = button.textContent;
    button.textContent = "Copied";
    window.setTimeout(function () { button.textContent = was; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () {
      button.textContent = "Copy failed. Select the text above instead.";
    });
    return;
  }
  button.textContent = "Copy failed. Select the text above instead.";
}

/* ---- actions -------------------------------------------------------------
   The write half of the page. Three rules hold it together.

   The whitelist comes from the SERVER, over GET /api/actions, and the page
   sends back an id and nothing else - never a command, never a path. An action
   the server reports unavailable renders as a reason and no button at all,
   because a dead button is worse than an absent one.

   Every piece of transient state lives OUTSIDE the DOM: the catalogue, what is
   armed, what is running, and the last result per action. The rail is morphed
   on every poll, so state kept in the markup would be wiped every two seconds
   or, worse, survive as a stale confirm on a button that now means something
   else.

   A destructive action arms first and runs second, and the armed step shows the
   server's own confirm sentence rather than a generic "are you sure". */
var ACTIONS = { status: "loading", list: [], reason: null };
var actionArmed = {};
var actionRunning = {};
var actionResult = {};

function loadCatalogue() {
  return window.fetch("/api/actions", { headers: { "Accept": "application/json" } })
    .then(function (response) {
      return response.json().then(function (body) {
        return { ok: response.ok, body: body };
      });
    })
    .then(function (answer) {
      if (answer.ok && answer.body.status === "ok") {
        ACTIONS = { status: "ok", list: answer.body.actions || [], reason: null };
      } else {
        ACTIONS = { status: "unavailable", list: [],
                    reason: (answer.body || {}).reason
                            || "the server did not answer with a whitelist" };
      }
      if (lastState) { renderRail(lastState); }
    })
    .catch(function (error) {
      ACTIONS = { status: "unavailable", list: [],
                  reason: "the whitelist could not be read: " + error };
      if (lastState) { renderRail(lastState); }
    });
}

function postAction(body) {
  body.token = TOKEN;
  return window.fetch("/api/action", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  }).then(function (response) {
    return response.json().then(function (parsed) {
      /* An HTTP status alone is not the verdict: a refusal and a failed effect
         are both meaningful answers with a reason attached. */
      parsed.http = response.status;
      return parsed;
    });
  });
}

function runAction(id, dryRun) {
  if (actionRunning[id]) { return; }
  actionRunning[id] = true;
  actionArmed[id] = false;
  if (lastState) { renderRail(lastState); }
  postAction({ id: id, confirm: true, dry_run: !!dryRun })
    .then(function (result) { actionResult[id] = result; })
    .catch(function (error) {
      actionResult[id] = { status: "failed",
                           reason: "the request itself failed: " + error };
    })
    .then(function () {
      actionRunning[id] = false;
      if (lastState) { renderRail(lastState); }
      /* Availability changes with what just ran - a daemon that is now up, a
         script that was just regenerated - so the catalogue is re-read rather
         than assumed to still hold. */
      loadCatalogue();
    });
}

function actionResultBlock(host, result) {
  var box = el("div", "act-result");
  var bad = result.status !== "ok";
  box.appendChild(el("div", bad ? "bad" : null, result.status
    + (result.dry_run ? " (dry run)" : "")
    + (result.exit_code === null || result.exit_code === undefined
       ? "" : ", exit " + result.exit_code)));
  if (result.reason) { box.appendChild(el("div", null, result.reason)); }
  if (result.verify_detail) {
    box.appendChild(el("div", null,
      (result.verified === true ? "effect confirmed: "
       : result.verified === false ? "effect NOT confirmed: "
       : "effect unchecked: ") + result.verify_detail));
  }
  if (result.delivery) {
    box.appendChild(el("div", result.delivery === "unreachable" ? "bad" : null,
                       "delivery: " + result.delivery));
  }
  if (result.argv) {
    box.appendChild(el("div", "dispatch", [].concat(result.argv).join(" ")));
  }
  var tail = result.stderr_tail || result.stdout_tail;
  if (tail) { box.appendChild(el("div", "dispatch", tail)); }
  host.appendChild(box);
}

function actionEntry(entry) {
  var row = el("div", "act");
  var head = el("div", "act-head");
  head.appendChild(el("span", "act-name", entry.label));
  if (entry.destructive) {
    head.appendChild(el("span", "act-tag", "confirm"));
  }
  row.appendChild(head);
  row.appendChild(el("div", "act-what", entry.what));

  if (!entry.available) {
    row.appendChild(el("div", "act-why", "unavailable here: " + entry.reason));
    return row;
  }
  if (actionRunning[entry.id]) {
    var busy = el("div", "act-row");
    var waiting = el("button", "btn", "running");
    waiting.type = "button";
    waiting.disabled = true;
    busy.appendChild(waiting);
    row.appendChild(busy);
  } else if (actionArmed[entry.id]) {
    row.appendChild(el("div", "act-confirm", entry.confirm));
    var armed = el("div", "act-row");
    var go = el("button", "btn", "Confirm and run");
    go.type = "button";
    go.setAttribute("data-act-run", entry.id);
    var cancel = el("button", "btn", "Cancel");
    cancel.type = "button";
    cancel.setAttribute("data-act-cancel", entry.id);
    armed.appendChild(go);
    armed.appendChild(cancel);
    row.appendChild(armed);
  } else {
    var controls = el("div", "act-row");
    var run = el("button", "btn", entry.destructive ? "Run" : "Run now");
    run.type = "button";
    run.setAttribute(entry.destructive ? "data-act-arm" : "data-act-run",
                     entry.id);
    var dry = el("button", "btn", "Dry run");
    dry.type = "button";
    dry.setAttribute("data-act-dry", entry.id);
    controls.appendChild(run);
    controls.appendChild(dry);
    row.appendChild(controls);
  }
  if (actionResult[entry.id]) {
    actionResultBlock(row, actionResult[entry.id]);
  }
  return row;
}

function renderActionsPanel() {
  var panel = railPanel("Actions");
  if (ACTIONS.status === "loading") {
    panel.appendChild(el("div", "act-why", "reading the whitelist"));
    return panel;
  }
  if (ACTIONS.status !== "ok") {
    unavailable(panel, "No actions offered", ACTIONS);
    return panel;
  }
  ACTIONS.list.forEach(function (entry) {
    if (entry.kind !== "inbox") { panel.appendChild(actionEntry(entry)); }
  });
  var messaging = ACTIONS.list.some(function (entry) {
    return entry.kind === "inbox";
  });
  if (messaging) {
    panel.appendChild(el("div", "act-why",
      "To send a session a message, use Send on its card in the fleet strip: "
      + "a message needs a target, and the strip is where the targets are."));
  }
  return panel;
}

document.addEventListener("click", function (event) {
  if (!event.target.closest) { return; }
  var arm = event.target.closest("[data-act-arm]");
  if (arm) {
    actionArmed[arm.getAttribute("data-act-arm")] = true;
    if (lastState) { renderRail(lastState); }
    return;
  }
  var cancel = event.target.closest("[data-act-cancel]");
  if (cancel) {
    actionArmed[cancel.getAttribute("data-act-cancel")] = false;
    if (lastState) { renderRail(lastState); }
    return;
  }
  var dry = event.target.closest("[data-act-dry]");
  if (dry) { runAction(dry.getAttribute("data-act-dry"), true); return; }
  var run = event.target.closest("[data-act-run]");
  if (run) { runAction(run.getAttribute("data-act-run"), false); }
});

/* ---- compose -------------------------------------------------------------
   Deliberately a dialog appended to the body rather than a form inside a fleet
   card: the strip is morphed on every poll, and a textarea living there would
   have whatever was being typed reconciled away mid-sentence. */
var compose = null;

function composeDialog() {
  if (compose) { return compose; }
  compose = document.createElement("dialog");
  compose.className = "compose";
  compose.id = "compose";
  var who = el("div", "act-what", "");
  who.id = "compose-who";
  var area = document.createElement("textarea");
  area.id = "compose-text";
  area.setAttribute("aria-label", "Message to send to this session");
  var row = el("div", "compose-row");
  var send = el("button", "btn", "Send");
  send.type = "button";
  send.id = "compose-send";
  var close = el("button", "btn", "Close");
  close.type = "button";
  var note = el("p", "compose-note", "");
  note.id = "compose-note";
  row.appendChild(send);
  row.appendChild(close);
  compose.appendChild(el("h3", null, "Send to a session"));
  compose.appendChild(who);
  compose.appendChild(area);
  compose.appendChild(row);
  compose.appendChild(note);
  document.body.appendChild(compose);
  close.addEventListener("click", function () { compose.close(); });
  send.addEventListener("click", function () {
    var target = compose.getAttribute("data-target");
    var noteBox = document.getElementById("compose-note");
    send.disabled = true;
    noteBox.className = "compose-note";
    txt(noteBox, "sending");
    postAction({ id: "inbox.send", target: target,
                 text: document.getElementById("compose-text").value })
      .then(function (result) {
        send.disabled = false;
        if (result.status !== "ok") {
          noteBox.className = "compose-note bad";
          txt(noteBox, "refused: " + result.reason);
          return;
        }
        /* Never the word "sent". The message is written; whether anything will
           READ it is a different question, and the server answers it. */
        txt(noteBox, result.delivery === "queued"
          ? "written to the inbox. The session picks it up on its next turn."
          : "written, but this session is unreachable: "
            + (result.verify_detail || "no delivery hook is installed"));
        document.getElementById("compose-text").value = "";
      })
      .catch(function (error) {
        send.disabled = false;
        noteBox.className = "compose-note bad";
        txt(noteBox, "the request failed: " + error);
      });
  });
  return compose;
}

function openCompose(target, label) {
  var box = composeDialog();
  var note = document.getElementById("compose-note");
  box.setAttribute("data-target", target);
  txt(document.getElementById("compose-who"), label);
  txt(note, "");
  note.className = "compose-note";
  document.getElementById("compose-text").value = "";
  if (box.showModal) { box.showModal(); } else { box.setAttribute("open", ""); }
  document.getElementById("compose-text").focus();
}

document.addEventListener("click", function (event) {
  if (!event.target.closest) { return; }
  var send = event.target.closest("[data-send-to]");
  if (send) {
    openCompose(send.getAttribute("data-send-to"),
                send.getAttribute("data-send-label") || "");
  }
});

function railPlaceholder(label, section) {
  /* A panel a collector could not build keeps its tab and says why. Dropping it
     would leave a tab pointing at nothing, and renumbering the strip between
     polls is worse than an honest empty panel (R8). */
  var panel = railPanel(label);
  unavailable(panel, label + " unavailable", section);
  return panel;
}

function renderRail(state) {
  var next = stage();
  RAIL_TABS.forEach(function (tab) {
    var panel = tab.build(state);
    if (!panel) {
      panel = railPlaceholder(tab.label, {
        status: "unavailable",
        reason: "no harness on this machine reports it"
      });
    }
    panel.dataset.rail = tab.id;
    /* Set on the STAGED node, so the morph carries it: an attribute written
       afterwards would survive until the next poll and no longer. */
    panel.dataset.active = (tab.id === railTab) ? "1" : "0";
    next.appendChild(panel);
  });
  morph(document.getElementById("rail"), next);
  applyRailTab();
}

/* ---- which sessions are shown -------------------------------------------
   One classifier and one control, used by BOTH the Sessions strip and the
   Real-Time Process tab. Two panels asking the same question must not answer it
   twice: a session counted active in one tab and idle in the other is a
   dashboard disagreeing with itself.

   A session is `noflow` when its harness cannot report a step timeline at all,
   which is a statement about the HARNESS; `idle` when it can and reports
   waiting; `active` otherwise. Those are different facts and the filter keeps
   them apart rather than merging them into "nothing happening". */
var SESSION_CLASSES = [
  { id: "active", label: "active" },
  { id: "idle", label: "idle" },
  { id: "noflow", label: "no flow reported" }
];
var SESSION_FILTER_KEY = "rt-observe-sessions";

function storedFilter() {
  var on = {};
  SESSION_CLASSES.forEach(function (entry) { on[entry.id] = true; });
  try {
    var saved = window.localStorage.getItem(SESSION_FILTER_KEY);
    if (saved !== null) {
      var picked = saved.split(",");
      SESSION_CLASSES.forEach(function (entry) {
        on[entry.id] = picked.indexOf(entry.id) !== -1;
      });
    }
  } catch (error) {
    /* Blocked storage shows everything, which is the safe direction: a filter
       that silently defaults to hiding is how a session goes missing. */
  }
  return on;
}

var sessionFilter = storedFilter();

function sessionClass(session) {
  var flow = session.flow || {};
  if (flow.status !== "ok") { return "noflow"; }
  return flow.state === "idle" ? "idle" : "active";
}

function sessionShown(session) {
  return sessionFilter[sessionClass(session)] !== false;
}

function renderFilter(hostId) {
  var host = document.getElementById(hostId);
  if (!host) { return; }
  var next = stage();
  next.appendChild(el("span", null, "show"));
  SESSION_CLASSES.forEach(function (entry) {
    var label = el("label");
    var box = document.createElement("input");
    box.type = "checkbox";
    box.dataset.sess = entry.id;
    if (sessionFilter[entry.id] !== false) { box.setAttribute("checked", ""); }
    label.appendChild(box);
    label.appendChild(document.createTextNode(" " + entry.label));
    next.appendChild(label);
  });
  morph(host, next);
}

function hiddenNote(hidden) {
  if (!hidden) { return ""; }
  /* Said out loud, always. A filter that hides without saying how much turns
     an empty panel into a false answer. */
  return hidden + " hidden by the filter";
}

document.addEventListener("change", function (event) {
  var box = event.target.closest && event.target.closest("[data-sess]");
  if (!box) { return; }
  sessionFilter[box.dataset.sess] = box.checked;
  remember(SESSION_FILTER_KEY, SESSION_CLASSES.filter(function (entry) {
    return sessionFilter[entry.id] !== false;
  }).map(function (entry) { return entry.id; }).join(","));
  if (lastState) {
    renderFleet(lastState);
    renderLive(lastState);
  }
});

/* ---- fleet --------------------------------------------------------------- */
function claudeCard(session, label) {
  var card = el("div", "fleet-card");
  card.appendChild(el("h4", null,
    (session.cwd || "").split(/[\\/]/).filter(Boolean).pop()
    || session.project || "session"));
  var meta = [label];
  if (session.branch) { meta.push(session.branch); }
  if (session.mode) { meta.push(session.mode); }
  if (session.effort) { meta.push(session.effort); }
  if (session.entrypoint) { meta.push(session.entrypoint); }
  meta.push(duration(session.age_seconds) + " ago");
  card.appendChild(el("div", "fleet-meta", meta.join(" . ")));
  if (session.prompt) {
    card.appendChild(el("div", "fleet-prompt", session.prompt));
  }
  var flags = el("div", "fleet-flags");
  if (session.subagents) {
    flags.appendChild(el("span", null, session.subagents + " subagents "));
  }
  if ((session.hook_errors || []).length) {
    flags.appendChild(el("span", "bad",
      session.hook_errors.length + " stop-hook errors "));
  }
  if (session.plan) { flags.appendChild(el("span", null, "plan on file ")); }
  var inbox = session.inbox || {};
  if (inbox.pending) {
    flags.appendChild(el("span", null, inbox.pending + " queued "));
  }
  if (!inbox.reachable) {
    flags.appendChild(el("span", null, "unreachable"));
    flags.title = inbox.reason || "";
  }
  card.appendChild(flags);
  if (inbox.reachable && session.session_id) {
    /* Offered only where a message would actually be READ. An unreachable
       session keeps its flag and no button: a Send that writes into a directory
       nobody drains is the vault drop that sat unread in working/ for an hour. */
    var send = el("button", "btn", "Send");
    send.type = "button";
    send.setAttribute("data-send-to", session.session_id);
    send.setAttribute("data-send-label",
      (session.cwd || session.project || "session") + " . "
      + session.session_id);
    card.appendChild(send);
  }
  return card;
}

function copilotCard(session, label) {
  var card = el("div", "fleet-card");
  card.appendChild(el("h4", null,
    (session.cwd || "").split(/[\\/]/).pop() || "session"));
  var meta = [label];
  if (session.host_type) { meta.push(session.host_type); }
  if (session.branch) { meta.push(session.branch); }
  if (session.agent_name) { meta.push(session.agent_name); }
  card.appendChild(el("div", "fleet-meta", meta.join(" . ")));
  if (session.summary) {
    card.appendChild(el("div", "fleet-prompt", session.summary));
  }
  var flags = el("div", "fleet-flags");
  flags.appendChild(el("span", null, "unreachable"));
  flags.dataset.detail = "note";
  flags.dataset.detailTitle = "unreachable";
  flags.dataset.detailNote = (session.inbox || {}).reason
    || "no delivery path was reported for this harness";
  card.appendChild(flags);
  return card;
}

function renderFleet(state) {
  var host = document.getElementById("fleet");
  var note = document.getElementById("fleet-note");
  var fleet = state.fleet || {};
  var next = stage();

  if (fleet.status && fleet.status !== "ok") {
    txt(note, "");
    unavailable(next, "Sessions unavailable", fleet);
    morph(host, next);
    return;
  }
  var installed = fleet.installed || [];
  if (!installed.length) {
    /* The zero-harness clone is the FIRST thing a lab member sees, and a blank
       strip would read as a broken page. It is a supported configuration, so it
       says so, and it says which panels above do not need a harness at all. */
    txt(note, "none installed here");
    var box = el("div", "fleet-empty");
    box.appendChild(el("h4", null, "No agent harness installed here"));
    box.appendChild(el("p", null,
      "The matrix tab, and the registry and repository panels in the rail, are "
      + "complete without one. They read the files in this clone, so they answer "
      + "whether your checkout deployed correctly on any machine."));
    box.appendChild(el("p", null,
      "This tab, the hooks panel and live MCP fill in once you run Claude Code "
      + "or GitHub Copilot Chat on this machine. Nothing else here requires "
      + "either."));
    var notBuilt = fleet.not_built || [];
    if (notBuilt.length) {
      box.appendChild(el("p", null,
        "Documented but not built: "
        + notBuilt.map(function (n) {
            return typeof n === "string" ? n : n.id;
          }).join(", ") + "."));
    }
    next.appendChild(box);
    morph(host, next);
    return;
  }

  var cards = 0;
  var hidden = 0;
  var strip = el("div", "fleet");
  installed.forEach(function (id) {
    var harness = (fleet.harnesses || {})[id] || {};
    if (harness.status !== "ok") {
      var box = el("div", "fleet-card");
      unavailable(box, (harness.label || id) + " unavailable", harness);
      strip.appendChild(box);
      return;
    }
    (harness.sessions || []).forEach(function (session) {
      if (!sessionShown(session)) { hidden += 1; return; }
      strip.appendChild(id === "copilot_chat"
        ? copilotCard(session, harness.label || id)
        : claudeCard(session, harness.label || id));
      cards += 1;
    });
  });
  if (!cards && hidden) {
    strip.appendChild(el("div", "fleet-card",
      "Every session here is hidden by the filter above."));
  }
  txt(note, cards + " recent across " + installed.length
      + " harness" + (installed.length === 1 ? "" : "es")
      + (hidden ? ". " + hiddenNote(hidden) : ""));
  next.appendChild(strip);
  morph(host, next);
  renderFilter("fleet-filter");
}

/* ---- the Real-Time Process tab -------------------------------------------
   What the harness is doing NOW, drawn from the two figures the operator
   already made: the session state machine of `c2:fig:hooks_states`, and the
   subagent fan-out of `c2:fig:superpowers_collab`, where a subagent hangs off
   the session that spawned it.

   Adapter-fed like every other harness fact. A harness that cannot report a
   step SAYS so rather than being drawn as an idle flow: idle and unreportable
   look identical on a diagram and mean opposite things. */
/* The state machine of `c2:fig:hooks_states`, kept as a slim header strip, and
   below it the thing the figure could not show on paper: every LINE that is
   running. The operator's brief, in their words - a hook drawn as a hook, each
   subagent on its own line with its own tools and skills, the two memories as
   boxes every line reaches because every subagent shares them, and skills as
   boxes rather than as one more step in a row. */
var ROLE_CODE = { hook: "HK", core: "CO", security: "SE", idle: "ID" };
/* Which box a hook loops on. The harness names the EVENT, and the event decides
   where the loop hangs - the figure draws caveman looping on UserPromptSubmit
   and RTK on the reasoning box for exactly this reason. An event this table does
   not know hangs off no box and is still listed on its lane. */
var HOOK_STATE = {
  SessionStart: "session_start",
  UserPromptSubmit: "prompt",
  PreToolUse: "tool",
  PostToolUse: "post_tool",
  PreCompact: "reasoning",
  Stop: "idle",
  SessionEnd: "idle"
};
var pickedStep = null;

function loopsByState(hooks, declared) {
  /* Every hook this machine DECLARES gets its loop, whether or not a firing is
     still in the transcript tail. Measured 2026-09-01: a hook that runs once at
     SessionStart scrolls out of the tail within minutes of work, so on any
     session older than an hour the diagram showed PreToolUse and PostToolUse
     and nothing else - and RTK and caveman, the two the figure draws AS
     background loops, were never visible at all.

     A firing upgrades a declared name from `declared` to `fired`, and a
     non-zero exit to `blocked`. */
  var by = {};
  (declared || []).forEach(function (row) {
    var state = HOOK_STATE[row.event];
    if (!state) { return; }
    (by[state] = by[state] || []);
    (row.names || []).forEach(function (name) {
      by[state].push({ name: name, label: name, declared: true });
    });
  });
  (hooks || []).forEach(function (hook) {
    var state = HOOK_STATE[hook.event];
    if (!state) { return; }
    var list = (by[state] = by[state] || []);
    var label = hook.label || hook.name;
    var match = list.filter(function (entry) {
      return entry.declared
        && (entry.name.indexOf(label) === 0 || label.indexOf(entry.name) === 0);
    })[0];
    if (match) {
      match.fired = true;
      match.exit = hook.exit;
      match.label = label;
      return;
    }
    list.push({ name: label, label: label, fired: true, exit: hook.exit });
  });
  return by;
}

function machineSvg(states, live, travelled, hooks, declared) {
  /* One row of states, the live one filled, the arcs travelled this turn at
     double width with a marker running along them, and one dashed self-loop per
     box carrying the hooks that run there.

     The geometry is vertical on purpose. Measured 2026-09-01: the hook names
     were laid along ONE line above the boxes and ran into each other, so the
     strip was unreadable at exactly the moment it had something to say. Names
     are stacked instead, clipped to the width of the box they belong to, two at
     most, and the rest is a count that the hover panel expands. */
  var boxW = 118;
  var boxH = 34;
  var gap = 26;
  var width = Math.max(660, states.length * (boxW + gap));
  var step = (width - boxW) / Math.max(1, states.length - 1);
  var nameY = [12, 24];
  var arcTop = 32;
  var boxTop = 48;
  var midY = boxTop + boxH / 2;
  var height = boxTop + boxH + 14;
  var parts = [];
  var centres = [];
  var loops = loopsByState(hooks, declared);

  var clip = function (text, chars) {
    text = String(text);
    return text.length > chars ? text.slice(0, chars - 1) + "." : text;
  };

  states.forEach(function (state, index) {
    var x = index * step;
    var mid = x + boxW / 2;
    centres.push(mid);
    var on = state.id === live;
    var cls = "m-box m-box--" + state.role + (on ? " m-box--live" : "");
    parts.push('<g data-detail="mstate" data-detail-key="' + state.id
      + '" data-detail-name="' + escapeText(state.label)
      + '" data-detail-role="' + state.role + '" tabindex="0">'
      + '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + boxTop
      + '" width="' + boxW + '" height="' + boxH + '"/>'
      + '<text class="m-role" x="' + mid.toFixed(1) + '" y="' + (boxTop + 13)
      + '" text-anchor="middle">' + ROLE_CODE[state.role] + "</text>"
      + '<text class="m-label' + (on ? " m-live-text" : "") + '" x="'
      + mid.toFixed(1) + '" y="' + (boxTop + 26) + '" text-anchor="middle">'
      + escapeText(clip(state.label, 17))
      + "</text></g>");

    var fired = loops[state.id] || [];
    if (!fired.length) { return; }
    var blocked = fired.some(function (hook) { return hook.exit; });
    var lines = fired.slice(0, 2).map(function (hook) {
      return clip(hook.label || hook.name, 16);
    });
    if (fired.length > 2) {
      lines[1] = (lines[1] ? lines[1] + " " : "") + "+" + (fired.length - 2);
    }
    var detail = fired.map(function (hook) {
      return (hook.label || hook.name)
        + (hook.exit ? " (refused, exit " + hook.exit + ")"
                     : (hook.fired ? " (fired this session)"
                                   : " (declared, no firing in the tail)"));
    }).join("; ");

    parts.push('<g data-detail="note" data-detail-title="'
      + escapeText(state.label) + ' hooks" data-detail-note="'
      + escapeText(detail) + '" tabindex="0">'
      + '<path class="m-loop' + (blocked ? " m-loop--blocked" : "")
      + '" d="M' + (mid - 13).toFixed(1) + "," + boxTop
      + " C" + (mid - 16).toFixed(1) + "," + arcTop + " "
      + (mid + 16).toFixed(1) + "," + arcTop + " " + (mid + 13).toFixed(1)
      + "," + boxTop + '"/>'
      + lines.map(function (text, row) {
          return '<text class="m-loop-label'
            + (blocked ? " m-loop-label--blocked" : "") + '" x="'
            + mid.toFixed(1) + '" y="' + nameY[row] + '" text-anchor="middle">'
            + escapeText(text) + "</text>";
        }).join("")
      + "</g>");
  });

  states.forEach(function (state, index) {
    if (index === 0) { return; }
    var from = centres[index - 1] + boxW / 2 - 2;
    var to = centres[index] - boxW / 2 + 2;
    var was = travelled[state.id];
    var path = "M" + from.toFixed(1) + "," + midY + " L" + to.toFixed(1)
      + "," + midY;
    parts.push('<path class="m-edge' + (was ? " m-edge--travelled" : "")
      + '" d="' + path + '"/>');
    if (state.id === "post_tool") {
      /* The one edge worth naming: what travels from a tool call to PostToolUse
         is the tool RESULT. */
      parts.push('<text class="m-edge-label" x="'
        + ((from + to) / 2).toFixed(1) + '" y="' + (midY - 6)
        + '" text-anchor="middle">result</text>');
    }
    if (was && !REDUCED) {
      parts.push('<circle class="m-runner" r="3">'
        + '<animateMotion dur="1.4s" repeatCount="indefinite" path="'
        + path + '"/></circle>');
    }
  });

  return '<svg class="machine" viewBox="0 0 ' + width.toFixed(0) + ' '
    + height + '" style="height:' + height
    + 'px" role="img" aria-label="Harness state machine, currently '
    + escapeText(live) + '">' + parts.join("") + "</svg>";
}

/* ---- the three bars ------------------------------------------------------
   Not one of the three MAXIMA is reported anywhere on this machine - no
   transcript carries a context window, a plan limit or an invoice - so each is
   typed here, kept per viewer, and labelled as the operator's number. A bar
   with no maximum is not drawn at all: scaled to something arbitrary, a bar
   reads as fullness and says nothing. */
var LIMIT_KEYS = { session: "rt-observe-max-session",
                   week: "rt-observe-max-week",
                   supplement: "rt-observe-max-supplement" };

function storedLimit(which) {
  try {
    var saved = Number(window.localStorage.getItem(LIMIT_KEYS[which]));
    return saved > 0 ? saved : 0;
  } catch (error) {
    return 0;   /* blocked storage: no maximum, so no bar, and it says so */
  }
}

function setLimit(which, tokens) {
  remember(LIMIT_KEYS[which], String(Math.max(0, Math.round(tokens))));
  if (lastState) { renderLive(lastState); }
}

function thousands(tokens) {
  return Math.round(tokens / 1000).toLocaleString();
}

function meterRow(host, spec) {
  var row = el("div", "live-meter");
  row.appendChild(el("span", null, spec.label));
  var ratio = spec.max ? spec.used / spec.max : 0;
  if (spec.max) {
    var bar = el("div", "live-bar live-bar--" + spec.key
                        + (ratio >= 1 ? " live-bar--full" : ""));
    var fill = el("i");
    fill.style.width = Math.max(1, Math.min(100, Math.round(100 * ratio))) + "%";
    bar.appendChild(fill);
    row.appendChild(bar);
    row.appendChild(el("b", null, thousands(spec.used) + "K of "
                                  + thousands(spec.max) + "K"));
  } else {
    row.appendChild(el("b", "live-spend--none",
      thousands(spec.used) + "K used. Type a maximum for a bar."));
  }
  var input = document.createElement("input");
  input.type = "number";
  input.min = "0";
  input.step = "50";
  input.value = spec.max ? String(Math.round(spec.max / 1000)) : "";
  input.placeholder = "K";
  input.setAttribute("aria-label", spec.label + " maximum, thousands of tokens");
  input.dataset.limit = spec.key;
  row.appendChild(input);
  host.appendChild(row);
  return ratio;
}

document.addEventListener("change", function (event) {
  var input = event.target.closest && event.target.closest("[data-limit]");
  if (!input) { return; }
  setLimit(input.dataset.limit, Number(input.value) * 1000);
});

/* ---- the flow graph ------------------------------------------------------
   One LINE per running thing - the session, then each subagent it spawned -
   and, to the right, the resources every line shares: the two memories, the
   network, and one box per MCP server. A subagent is drawn on its own line
   because that is what it is: a separate process with its own tools, its own
   skills and its own hooks, reaching the SAME vault and the same graph. */
var SHARED_NODES = [
  { id: "obsidian", label: "Obsidian vault",
    note: "the cross-project memory. Every line reaches the same one, and only "
        + "local-writer may write it" },
  { id: "graphify", label: "Graphify graph",
    note: "this repository's structure memory, reached through the same single "
        + "writer" },
  { id: "internet", label: "Internet",
    note: "a call that left this machine" }
];

function sharedState(state) {
  /* What the shared boxes are HOLDING, not merely what they are.

     The vault box lists the outbox: what is staged and waiting to be written,
     what is parked for review, what is in flight. It is rebuilt from the
     filesystem on every collection, so a note the daemon consumes leaves this
     list on the next poll with nothing to synchronise by hand - which is the
     property the operator asked for. */
  var out = {};
  var daemon = ((state.services || {}).vault_daemon) || {};
  var pending = daemon.pending || [];
  var lines = pending.map(function (entry) {
    return entry.name + " " + entry.state + ", " + duration(entry.age_seconds);
  });
  var hidden = (daemon.pending_total || 0) - pending.length;
  if (hidden > 0) { lines.push("+" + hidden + " more waiting"); }
  out.obsidian = {
    count: daemon.pending_total || 0,
    means: daemon.running === false
      ? "the daemon is not running, so nothing is consuming these"
      : "staged in the outbox, written by the daemon",
    lines: lines.length ? lines : ["nothing waiting to be written"]
  };

  var graph = state.graph || {};
  var graphLines = [];
  if (graph.status === "ok") {
    if (graph.nodes) { graphLines.push("nodes " + graph.nodes); }
    if (graph.links) { graphLines.push("edges " + graph.links); }
    if (graph.age_seconds !== undefined && graph.age_seconds !== null) {
      graphLines.push("snapshot " + duration(graph.age_seconds) + " old");
    }
    if (graph.stale) { graphLines.push("stale, a refresh is pending"); }
  } else {
    graphLines.push(graph.reason || "no snapshot has been produced");
  }
  out.graphify = {
    count: graph.nodes || 0,
    means: "rendered from a snapshot local-writer produced, never from the "
         + "graph itself",
    lines: graphLines
  };
  return out;
}

function laneModel(state) {
  /* What is running, as lines. The main line is the session; each subagent it
     dispatched is a line of its own, carrying whatever the harness reports of
     it - which for a background agent is the dispatch and no more, and that is
     said rather than drawn as an empty flow. */
  var lanes = [];
  var fleet = state.fleet || {};
  (fleet.installed || []).forEach(function (id) {
    var harness = (fleet.harnesses || {})[id] || {};
    if (harness.status !== "ok") { return; }
    (harness.sessions || []).forEach(function (session) {
      if (!sessionShown(session)) { return; }
      var flow = session.flow || {};
      if (flow.status !== "ok") { return; }
      var name = (session.cwd || "").split(/[\\/]/).filter(Boolean).pop()
        || session.project || "session";
      lanes.push({
        id: "s:" + session.session_id,
        label: name,
        kind: "session",
        state: flow.state,
        tokens: flow.tokens || {},
        steps: (flow.steps || []).filter(function (step) {
          return !step.sidechain;
        }),
        hooks: flow.hooks || []
      });
      (flow.subagents || []).forEach(function (agent, index) {
        lanes.push({
          id: "a:" + session.session_id + ":" + index,
          label: agent.name,
          kind: "subagent",
          parent: "s:" + session.session_id,
          state: "spawned",
          tokens: {},
          at: agent.at,
          steps: (flow.steps || []).filter(function (step) {
            return step.sidechain;
          }),
          hooks: []
        });
      });
    });
  });
  return lanes;
}

function sharedLinks(lane) {
  /* Which shared boxes this line reached, and from which step. Attribution is
     deliberately narrow: a network flag is evidence, a local-writer dispatch is
     evidence, and a hook naming the outbox is evidence. Nothing is inferred
     from a command line, which is free text and often a path. */
  var links = [];
  (lane.steps || []).forEach(function (step, index) {
    if (step.network === "yes") { links.push({ at: index, to: "internet" }); }
    if (step.network === "mcp" && step.server) {
      links.push({ at: index, to: "mcp:" + step.server });
    }
    if (step.kind === "subagent" && /writer/.test(step.name || "")) {
      links.push({ at: index, to: "obsidian" });
      links.push({ at: index, to: "graphify" });
    }
  });
  (lane.hooks || []).forEach(function (hook) {
    if (/outbox|obsidian|vault/i.test(hook.label || "")) {
      links.push({ at: Math.max(0, (lane.steps || []).length - 1),
                   to: "obsidian" });
    }
  });
  if (lane.kind === "subagent" && /writer/.test(lane.label || "")) {
    links.push({ at: 0, to: "obsidian" });
    links.push({ at: 0, to: "graphify" });
  }
  return links;
}

function hookGlyph(x, y, blocked) {
  /* A hook, drawn as a hook: a shank down from the line, then the bend and the
     point. The operator asked for the thing itself rather than a label. */
  return '<path class="fx-hook' + (blocked ? " fx-hook--blocked" : "")
    + '" d="M' + x.toFixed(1) + "," + y.toFixed(1)
    + " v9 a4.5,4.5 0 1,0 -8,0 v-2" + '"/>';
}

function laneEvents(steps) {
  /* One box per TOOL, not per invocation.

     Grouping only consecutive runs left a line of identical `Bash` boxes
     separated by whatever ran between them, which is a picture of the
     transcript rather than of the work. A tool is one box now, carrying how
     many times it was called, when it was last called, and every individual
     call underneath for the hover panel.

     `tool result` is still the return leg of the call before it, so it marks
     that call returned - or FAILED, which is a result too and was the one the
     drawing could not show. Reasoning is what the agent IS between calls, so it
     is not an event at all. */
  var groups = [];
  var byName = {};
  var lastCall = null;
  (steps || []).forEach(function (step) {
    if (step.kind === "result") {
      if (lastCall) {
        lastCall.resulted = true;
        lastCall.failed = !!step.error;
        lastCall.group.resulted = true;
        if (step.error) { lastCall.group.failures += 1; }
      }
      return;
    }
    if (step.kind === "reasoning") { return; }
    var name = step.name || step.kind;
    var key = step.kind + "|" + name;
    var group = byName[key];
    if (!group) {
      group = { kind: step.kind, name: name, count: 0, calls: [],
                at: "", network: step.network || "",
                server: step.server || "", resulted: false, failures: 0,
                order: groups.length };
      byName[key] = group;
      groups.push(group);
    }
    group.count += 1;
    group.at = step.at || group.at;
    lastCall = { at: step.at || "", resulted: false, failed: false,
                 group: group };
    group.calls.push(lastCall);
    /* The group the LAST call belongs to is the one that is live. */
    groups.forEach(function (other) { other.live = false; });
    group.live = true;
  });
  groups.forEach(function (group) {
    group.failed = group.failures > 0;
  });
  return groups;
}

function callLines(group, cap) {
  /* One line per call, for the hover panel: the time and how it ended. Asked
     for in those words - Bash, time, status, one line each. */
  var lines = group.calls.slice(-cap).map(function (call) {
    return (call.at ? clock(call.at) : "?") + " "
      + (call.failed ? "failed" : (call.resulted ? "ok" : "out"));
  });
  var hidden = group.calls.length - lines.length;
  if (hidden > 0) { lines.push("+" + hidden + " earlier"); }
  return lines.join("|");
}

/* Which family a tool belongs to. Identity, not severity: it lets a shell call
   be told from a file write without reading either label. */
function toolFamily(event) {
  if (event.network === "yes" || event.network === "mcp") { return "net"; }
  var name = (event.name || "").toLowerCase();
  if (/bash|shell|powershell|run|test/.test(name)) { return "run"; }
  if (/write|edit|notebook|patch/.test(name)) { return "write"; }
  return "read";
}

function flowLegend() {
  /* Four marks, four meanings, said once rather than left to be inferred. It
     names what the drawing ACTUALLY uses: a legend naming a mark that is no
     longer drawn is worse than no legend. */
  var box = el("div", "fx-legend");
  [["agent", "a session or a subagent, with a ring showing what it holds"],
   ["call", "a tool call, on a wire coloured by family; dashed while its "
          + "result is still out"],
   ["hook", "deterministic code the harness ran around a call"],
   ["memory", "a resource every agent shares: the vault, the graph, the "
            + "network"]].forEach(function (pair) {
    var item = el("div", "fx-legend-item");
    item.dataset.detail = "note";
    item.dataset.detailTitle = pair[0];
    item.dataset.detailNote = pair[1];
    item.appendChild(el("span", "fx-legend-mark fx-legend-mark--" + pair[0]));
    item.appendChild(el("b", null, pair[0]));
    box.appendChild(item);
  });
  return box;
}

function hexPath(cx, cy, r) {
  var points = [];
  for (var i = 0; i < 6; i += 1) {
    var a = (Math.PI / 180) * (60 * i - 90);
    points.push((cx + r * Math.cos(a)).toFixed(1) + ","
                + (cy + r * Math.sin(a)).toFixed(1));
  }
  return "M" + points.join(" L") + " Z";
}

function ringPath(cx, cy, r, ratio) {
  /* The token ring around an agent: an arc from the top, clockwise, as far as
     the ratio goes. Drawn only when there IS a ratio - the maximum is the
     operator's typed number, and without one there is nothing to fill. */
  var span = Math.max(0.001, Math.min(1, ratio)) * Math.PI * 2;
  var x1 = cx;
  var y1 = cy - r;
  var x2 = cx + r * Math.sin(span);
  var y2 = cy - r * Math.cos(span);
  return "M" + x1.toFixed(1) + "," + y1.toFixed(1) + " A" + r + "," + r
    + " 0 " + (span > Math.PI ? 1 : 0) + ",1 " + x2.toFixed(1) + ","
    + y2.toFixed(1);
}

function hookRows(lane, declared) {
  /* Every hook that could run on this agent, with the ones that DID in bold.
     Declared-but-quiet hooks are drawn too, because the roster is the answer to
     "what guards this session" and a hook that has not fired since the tail
     began is not a hook that is missing. */
  var rows = [];
  var seen = {};
  (lane.hooks || []).forEach(function (hook) {
    var name = hook.label || hook.name;
    if (seen[name]) { return; }
    seen[name] = true;
    rows.push({ name: name, fired: true, exit: hook.exit,
                note: (hook.label || hook.name)
                  + (hook.exit ? " - refused with exit " + hook.exit
                               : " - fired and allowed the call") });
  });
  (declared || []).forEach(function (row) {
    (row.names || []).forEach(function (name) {
      if (seen[name]) { return; }
      seen[name] = true;
      rows.push({ name: name, fired: false,
                  note: name + " - declared on " + row.event
                    + ", no firing inside the transcript tail" });
    });
  });
  return rows;
}

function agentGraph(lanes, width, sessionMax, declared, holding) {
  /* One NODE per running agent, its tool calls on curved links around it, its
     hooks named beside it, its subagents hanging below on a curve, and the
     memories every agent shares over on the right.

     The viewBox is computed from what was actually DRAWN rather than assumed:
     boxes sat outside the figure because the frame was a guess and the content
     was not. Every placement reports its extremities here, and the frame is
     whatever contains them. */
  var nodeR = 30;
  var ringR = 42;
  var rowH = 250;
  var colX = 300;
  var sharedX = Math.max(colX + 470, width - 170);
  var bounds = { minX: 0, minY: 0, maxX: width, maxY: 0 };
  var mark = function (x, y) {
    if (x < bounds.minX) { bounds.minX = x; }
    if (y < bounds.minY) { bounds.minY = y; }
    if (x > bounds.maxX) { bounds.maxX = x; }
    if (y > bounds.maxY) { bounds.maxY = y; }
  };

  var events = lanes.map(function (lane) { return laneEvents(lane.steps); });
  var shared = SHARED_NODES.slice();
  var seen = {};
  var links = [];
  lanes.forEach(function (lane, row) {
    sharedLinks({ steps: events[row], hooks: lane.hooks, kind: lane.kind,
                  label: lane.label }).forEach(function (link) {
      if (link.to.indexOf("mcp:") === 0 && !seen[link.to]) {
        seen[link.to] = true;
        shared.push({ id: link.to, label: link.to.slice(4),
                      note: "an MCP server. It may be a local process or a "
                          + "remote one; the harness does not say which" });
      }
      links.push({ row: row, to: link.to });
    });
  });
  var used = {};
  links.forEach(function (link) { used[link.to] = true; });
  shared = shared.filter(function (node) { return used[node.id]; });

  var sharedY = {};
  shared.forEach(function (node, index) { sharedY[node.id] = 70 + index * 52; });

  var parts = [];
  var centre = function (row) {
    return { x: colX + (lanes[row].kind === "subagent" ? 160 : 0),
             y: 130 + row * rowH };
  };

  shared.forEach(function (node) {
    var y = sharedY[node.id];
    var held = (holding || {})[node.id];
    mark(sharedX + 150, y + 20);
    parts.push('<g class="fx-shared" data-detail="note"'
      + ' data-detail-title="' + escapeText(node.label) + '"'
      + ' data-detail-note="' + escapeText(held ? held.means : node.note) + '"'
      + (held ? ' data-detail-lines="'
                + escapeText(held.lines.join("|")) + '"' : "")
      + ' tabindex="0">'
      + '<rect class="fx-shared-box" x="' + sharedX + '" y="' + (y - 14)
      + '" width="150" height="28"/>'
      + '<text class="fx-shared-label" x="' + (sharedX + 12) + '" y="'
      + (y + 4) + '">'
      + escapeText(node.label.length > 15
          ? node.label.slice(0, 14) + "." : node.label)
      + "</text>"
      /* The count on the box, so what is waiting is visible without hovering;
         the names are the hover's job. */
      + (held && held.count
          ? '<text class="fx-shared-count" x="' + (sharedX + 138) + '" y="'
            + (y + 4) + '" text-anchor="end">' + held.count + "</text>"
          : "")
      + "</g>");
  });

  lanes.forEach(function (lane, row) {
    var at = centre(row);
    mark(at.x - 170, at.y - ringR - 20);
    mark(at.x + ringR, at.y + ringR + 40);

    if (lane.kind === "subagent" && row > 0) {
      var from = centre(row - 1);
      parts.push('<path class="fx-spawn" d="M' + from.x + ',' + (from.y + nodeR)
        + " C" + from.x + "," + (from.y + rowH / 2) + " " + at.x + ","
        + (at.y - rowH / 2) + " " + at.x + "," + (at.y - ringR) + '"/>');
    }

    /* Tool calls, on an arc to the right of their agent, CLAMPED into the band
       between the agent and the shared column so no box can leave the frame. */
    var callW = 156;
    /* The most RECENTLY used tools, not the last few in first-seen order: a
       session that had used more than the cap lost the ones it had used least
       recently, and `Write` went missing from a session that had just written
       a file. */
    var ordered = events[row].slice().sort(function (a, b) {
      return String(a.at) < String(b.at) ? 1 : -1;
    });
    var shown = ordered.slice(0, CFG.flow_groups || 12).reverse();
    var dropped = events[row].length - shown.length;
    var leftEdge = at.x + ringR + 40;
    var rightEdge = Math.max(leftEdge + callW, sharedX - 30);
    shown.forEach(function (event, index) {
      var spread = shown.length > 1 ? 150 / (shown.length - 1) : 0;
      var angle = (-75 + index * spread) * Math.PI / 180;
      var bx = at.x + 210 * Math.cos(angle) + 70;
      var by = at.y + 96 * Math.sin(angle);
      bx = Math.max(leftEdge + callW / 2, Math.min(rightEdge - callW / 2, bx));
      var family = event.kind === "skill" ? "skill" : toolFamily(event);
      /* Live only while the agent itself is working: the last tool a session
         used is not being used while that session waits for a prompt. */
      var live = event.live && lane.state !== "idle";
      var id = "g|" + event.kind + "|" + event.name;
      mark(bx + callW / 2 + 6, by + 26);
      mark(bx - callW / 2 - 6, by - 20);
      parts.push('<path class="fx-wire fx-wire--' + family
        + (event.failed ? " fx-wire--failed" : "")
        + (live ? " fx-wire--live" : " fx-wire--quiet")
        + (event.resulted ? "" : " fx-wire--out") + '" d="M'
        + (at.x + ringR).toFixed(1) + "," + at.y.toFixed(1)
        + " Q" + ((at.x + bx) / 2).toFixed(1) + "," + at.y.toFixed(1) + " "
        + (bx - callW / 2).toFixed(1) + "," + by.toFixed(1) + '"/>');
      parts.push('<g class="fx-call fx-call--' + family
        + (event.failed ? " fx-call--failed" : "")
        + (live ? " fx-call--live" : " fx-call--quiet")
        + (pickedStep === id ? " fx-call--picked" : "")
        + '" data-detail="step" data-detail-kind="' + escapeText(event.kind)
        + '" data-detail-name="' + escapeText(event.name)
        + '" data-detail-at="' + escapeText(event.at)
        + '" data-detail-net="' + escapeText(event.network)
        + '" data-detail-server="' + escapeText(event.server)
        + '" data-detail-count="' + event.count
        + '" data-detail-failures="' + event.failures
        + '" data-detail-calls="' + escapeText(callLines(event, CFG.detail_rows))
        + '" data-step-id="' + escapeText(id) + '" tabindex="0">'
        + '<rect x="' + (bx - callW / 2).toFixed(1) + '" y="'
        + (by - 13).toFixed(1) + '" width="' + callW + '" height="26"/>'
        + (event.failed ? failMark(bx - callW / 2 + 12, by) : "")
        + '<text x="' + (bx - callW / 2 + (event.failed ? 26 : 12)).toFixed(1)
        + '" y="' + (by + 4).toFixed(1) + '">'
        + escapeText(event.name.length > 13
            ? event.name.slice(0, 12) + "." : event.name)
        + "</text>"
        /* How many times, and when it last ran. Both were asked for, and both
           are what turns a box from a label into a reading. */
        + '<text class="fx-call-count" x="' + (bx + callW / 2 - 10).toFixed(1)
        + '" y="' + (by + 4).toFixed(1) + '" text-anchor="end">'
        + event.count + "</text>"
        + '<text class="fx-call-at" x="' + (bx - callW / 2 + 12).toFixed(1)
        + '" y="' + (by + 22).toFixed(1) + '">'
        + escapeText(event.at ? clock(event.at) : "") + "</text>"
        + "</g>");
    });
    if (dropped > 0) {
      parts.push('<text class="fx-more" x="' + (at.x + 120) + '" y="'
        + (at.y + 130) + '">+' + dropped + " earlier</text>");
      mark(at.x + 200, at.y + 136);
    }

    /* Hooks, named, in a column to the LEFT of the agent. Bold when they FIRED,
       quiet when merely declared - the operator could not tell the two apart,
       and that difference is the whole point of the column. */
    var rows = hookRows(lane, lane.kind === "subagent" ? [] : declared);
    var visible = rows.slice(0, 6);
    visible.forEach(function (hook, index) {
      var hy = at.y - 58 + index * 22;
      mark(at.x - 176, hy + 14);
      parts.push('<g data-detail="note" data-detail-title="'
        + escapeText(hook.name) + '" data-detail-note="'
        + escapeText(hook.note) + '" tabindex="0">'
        + (hook.exit ? failMark(at.x - 168, hy + 5) : "")
        + hookGlyph(at.x - 150, hy, hook.exit)
        + '<text class="fx-hook-label'
        + (hook.fired ? " fx-hook-label--fired" : "")
        + (hook.exit ? " fx-hook-label--blocked" : "") + '" x="'
        + (at.x - 140) + '" y="' + (hy + 11) + '">'
        + escapeText(hook.name.slice(0, 18)) + "</text></g>");
    });
    if (rows.length > visible.length) {
      parts.push('<text class="fx-more" x="' + (at.x - 160) + '" y="'
        + (at.y - 58 + visible.length * 22 + 11) + '">+'
        + (rows.length - visible.length) + " more</text>");
    }

    var tokens = lane.tokens || {};
    var ratio = (sessionMax && tokens.held) ? tokens.held / sessionMax : 0;
    var awake = lane.state !== "idle" && lane.kind !== "subagent";
    parts.push('<g class="fx-agent fx-agent--' + lane.kind
      + (lane.state === "idle" ? " fx-agent--idle" : " fx-agent--live")
      + '" data-detail="note" data-detail-title="' + escapeText(lane.label)
      + '" data-detail-note="' + escapeText(lane.kind === "subagent"
          ? "a subagent: its own tools, its own skills, the same memories"
          : "a session of this harness, currently " + (lane.state || "idle"))
      + '" tabindex="0">'
      /* A ping leaving the node, repeating while the session works. The
         operator's test of the panel is whether it looks ALIVE when something
         is happening, and a still diagram fails it however correct it is.
         SMIL rather than CSS because the radius of a circle is geometry, and
         suppressed outright under reduced motion rather than merely slowed. */
      + (awake && !REDUCED
          ? '<circle class="fx-ping" cx="' + at.x + '" cy="' + at.y
            + '" r="' + ringR + '">'
            + '<animate attributeName="r" values="' + ringR + ";"
            + (ringR + 26) + '" dur="1.8s" repeatCount="indefinite"/>'
            + '<animate attributeName="opacity" values="0.55;0" dur="1.8s"'
            + ' repeatCount="indefinite"/></circle>'
          : "")
      + '<circle class="fx-ring-track" cx="' + at.x + '" cy="' + at.y
      + '" r="' + ringR + '"/>'
      + (ratio > 0
          ? '<path class="fx-ring' + (ratio >= 1 ? " fx-ring--full" : "")
            + '" d="' + ringPath(at.x, at.y, ringR, ratio) + '"/>'
          : "")
      + '<path class="fx-hex" d="' + hexPath(at.x, at.y, nodeR) + '"/>'
      + '<text class="fx-agent-state" x="' + at.x + '" y="' + (at.y + 4)
      + '" text-anchor="middle">'
      + escapeText((lane.state || "").slice(0, 8)) + "</text>"
      + '<text class="fx-agent-name" x="' + at.x + '" y="' + (at.y + ringR + 20)
      + '" text-anchor="middle">'
      + escapeText(lane.label.length > 18
          ? lane.label.slice(0, 17) + "." : lane.label) + "</text>"
      + '<text class="fx-agent-spend" x="' + at.x + '" y="'
      + (at.y + ringR + 34) + '" text-anchor="middle">'
      + escapeText(tokens.status === "ok"
          ? thousands(tokens.held) + "K held"
            + (sessionMax ? " of " + thousands(sessionMax) + "K" : "")
          : "tokens not reported") + "</text></g>");

    links.filter(function (link) { return link.row === row; })
      .forEach(function (link) {
        var ty = sharedY[link.to];
        if (ty === undefined) { return; }
        parts.push('<path class="fx-link" d="M' + (at.x + ringR) + ',' + at.y
          + " C" + ((at.x + sharedX) / 2) + "," + at.y + " "
          + ((at.x + sharedX) / 2) + "," + ty + " " + sharedX + "," + ty
          + '"/>');
      });
  });

  var defs = '<defs>'
    + '<filter id="fxglow" x="-60%" y="-60%" width="220%" height="220%">'
    + '<feGaussianBlur stdDeviation="4" result="blur"/>'
    + '<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/>'
    + "</feMerge></filter>"
    + "</defs>";

  var pad = 16;
  var vx = bounds.minX - pad;
  var vy = bounds.minY - pad;
  var vw = bounds.maxX - bounds.minX + pad * 2;
  var vh = bounds.maxY - bounds.minY + pad * 2;
  return '<svg class="flowgraph" viewBox="' + vx.toFixed(0) + " "
    + vy.toFixed(0) + " " + vw.toFixed(0) + " " + vh.toFixed(0)
    + '" style="height:' + Math.round(vh * Math.min(1, width / vw))
    + 'px" role="img" aria-label="One node per running agent, its tool calls '
    + 'around it, and the memories they share">' + defs + parts.join("")
    + "</svg>";
}

function failMark(x, y) {
  /* A failure, marked where it happened. Red, and a TRIANGLE rather than a
     colour change alone: the one state that must never be missed is also the
     one state that must survive a colour vision deficiency. */
  return '<path class="fx-fail" d="M' + x.toFixed(1) + "," + (y - 6).toFixed(1)
    + " L" + (x + 6).toFixed(1) + "," + (y + 5).toFixed(1)
    + " L" + (x - 6).toFixed(1) + "," + (y + 5).toFixed(1) + ' Z"/>';
}

var sessionFull = false;

function renderSpend(host, state) {
  var usage = state.usage || {};
  var box = el("div", "live-block");
  var head = el("div", "live-head");
  head.appendChild(el("b", null, "spend"));
  if (usage.status === "ok") {
    head.appendChild(el("span", null, "last " + usage.window_days + " days"));
  }
  box.appendChild(head);

  if (usage.status !== "ok") {
    unavailable(box, "usage unavailable", usage);
    host.appendChild(box);
    return;
  }

  var weekMax = storedLimit("week");
  var weekRatio = meterRow(box, { label: "week", key: "week",
                                  used: usage.tokens, max: weekMax });
  if (weekRatio >= 1 || sessionFull) {
    meterRow(box, {
      label: "supplement",
      key: "supplement",
      used: weekMax ? Math.max(0, usage.tokens - weekMax) : 0,
      max: storedLimit("supplement")
    });
    box.appendChild(el("div", "live-spend",
      "Past the week limit you set. The supplement bar counts TOKENS beyond "
      + "it, not money: no plan, invoice or payment method is readable from "
      + "this machine, so its maximum is yours to type as well."));
  }
  box.appendChild(el("div", "live-spend",
    usage.tokens.toLocaleString() + " tokens over " + usage.messages
    + " messages in " + usage.sessions + " sessions. " + usage.counts_what
    + "."));
  host.appendChild(box);
}

function sessionMeters(host, state) {
  var block = el("div", "live-block");
  var head = el("div", "live-head");
  head.appendChild(el("b", null, "sessions"));
  block.appendChild(head);
  var drawn = 0;
  (((state.fleet || {}).installed) || []).forEach(function (id) {
    var harness = ((state.fleet || {}).harnesses || {})[id] || {};
    if (harness.status !== "ok") { return; }
    (harness.sessions || []).forEach(function (session) {
      if (!sessionShown(session)) { return; }
      var tokens = (session.flow || {}).tokens || {};
      if (tokens.status !== "ok") { return; }
      var name = (session.cwd || "").split(/[\\/]/).filter(Boolean).pop()
        || session.project || "session";
      var full = meterRow(block, {
        label: name.slice(0, 12),
        key: "session",
        used: tokens.held,
        max: storedLimit("session") || CFG.context_window_tokens || 0
      }) >= 1;
      sessionFull = sessionFull || full;
      drawn += 1;
    });
  });
  if (drawn) { host.appendChild(block); }
}

function renderLive(state) {
  var host = document.getElementById("live");
  var next = stage();
  var fleet = state.fleet || {};
  if (fleet.status && fleet.status !== "ok") {
    unavailable(next, "Sessions unavailable", fleet);
    morph(host, next);
    return;
  }

  var machine = null;
  var hidden = 0;
  (fleet.installed || []).forEach(function (id) {
    var harness = (fleet.harnesses || {})[id] || {};
    if (harness.status !== "ok") {
      var box = el("div", "live-block");
      unavailable(box, (harness.label || id) + " unavailable", harness);
      next.appendChild(box);
      return;
    }
    if (!machine && harness.flow_states) { machine = harness; }
    (harness.sessions || []).forEach(function (session) {
      if (!sessionShown(session)) { hidden += 1; }
    });
  });

  var lanes = laneModel(state);

  /* A running dashboard re-reads its MARKUP from disk on every request but not
     its Python, so a page can be new while the snapshot behind it is old. That
     produced three false readings in one sitting - an empty `active` list, no
     declared hooks, no subagents - all of them reported as defects in the view
     when the view was fine. So the page checks the SHAPE of what it was served
     and says which half is stale. */
  if (machine && !machine.hook_loops) {
    var stale = el("div", "unavail");
    stale.appendChild(el("b", null, "the server behind this page is older than "
                                    + "the page"));
    stale.appendChild(el("div", null,
      "It is serving a snapshot with no hook roster, so declared hooks, "
      + "subagents and the newer flow fields cannot be drawn whatever this tab "
      + "does. Markup is re-read per request; Python is not. Restart the "
      + "dashboard to see them."));
    next.appendChild(stale);
  }

  if (machine && lanes.length) {
    var flow = lanes[0];
    var travelled = {};
    (flow.steps || []).forEach(function (step) {
      travelled[{ prompt: "prompt", reasoning: "reasoning", tool: "tool",
                  skill: "tool", subagent: "tool",
                  result: "post_tool" }[step.kind]] = true;
    });
    (flow.hooks || []).forEach(function (hook) {
      var hooked = HOOK_STATE[hook.event];
      if (hooked) { travelled[hooked] = true; }
    });
    var strip = el("div", "live-machine");
    strip.innerHTML = machineSvg(machine.flow_states, flow.state || "idle",
                                 travelled, flow.hooks, machine.hook_loops);
    next.appendChild(strip);
  }

  if (lanes.length) {
    var graph = el("div", "live-graph");
    /* Four marks, four meanings, said once rather than left to be inferred:
       a BOX is an actor, a HOOK is deterministic code the harness ran, an INPUT
       goes into a call and an OUTPUT comes back from one. */
    graph.appendChild(flowLegend());
    var box = document.getElementById("live");
    var width = Math.max(720, Math.round(
      (box ? box.getBoundingClientRect().width : 0) || 900));
    graph.innerHTML = agentGraph(
      lanes, width,
      storedLimit("session") || CFG.context_window_tokens || 0,
      machine ? machine.hook_loops : [],
      sharedState(state));
    next.appendChild(graph);
  } else {
    next.appendChild(el("div", "unavail", hidden
      ? "Every session here is hidden by the filter above. "
        + hiddenNote(hidden) + "."
      : "No harness on this machine reports a step timeline, so there is no "
        + "flow to draw. That is a statement about the harnesses installed "
        + "here, not about whether anything is running."));
  }

  sessionFull = false;
  sessionMeters(next, state);
  renderSpend(next, state);
  morph(host, next);
  var note = document.getElementById("live-note");
  if (note) {
    txt(note, "What the harness is doing right now"
        + (hidden ? ". " + hiddenNote(hidden) : "."));
  }
  renderFilter("live-filter");
}

registerDetail("step", function (host) {
  /* Asked for in these words: name, then one line per call with its time and
     how it ended. The box says how many and when last; the panel says each. */
  var pairs = [];
  (host.dataset.detailCalls || "").split("|").forEach(function (line) {
    if (!line) { return; }
    var cut = line.indexOf(" ");
    pairs.push(cut === -1 ? [line, ""]
                          : [line.slice(0, cut), line.slice(cut + 1)]);
  });
  if (!pairs.length && host.dataset.detailAt) {
    pairs.push([clock(host.dataset.detailAt), ""]);
  }
  if (host.dataset.detailNet === "yes") {
    pairs.push(["network", "this call leaves the machine"]);
  } else if (host.dataset.detailNet === "mcp") {
    pairs.push(["network", "through "
                + (host.dataset.detailServer || "an MCP server")
                + ", which may be remote"]);
  }
  var count = Number(host.dataset.detailCount) || 0;
  var failures = Number(host.dataset.detailFailures) || 0;
  return { title: host.dataset.detailName,
           means: (count ? count + (count === 1 ? " call" : " calls") : "")
             + (failures ? ", " + failures + " failed" : ""),
           pairs: pairs };
});

registerDetail("mstate", function (host) {
  return { title: host.dataset.detailName,
           means: { hook: "a deterministic hook, costing no tokens",
                    core: "the reasoning core, which is what tokens are spent on",
                    security: "a deterministic security audit",
                    idle: "waiting for the next prompt"
                  }[host.dataset.detailRole] || "" };
});

document.addEventListener("click", function (event) {
  var node = event.target.closest && event.target.closest("[data-step-id]");
  if (!node) { return; }
  /* History is not lost: any past step can be picked back up and held
     highlighted. Held in a module variable because the graph is rebuilt on
     every poll. */
  pickedStep = pickedStep === node.dataset.stepId ? null : node.dataset.stepId;
  if (lastState) { renderLive(lastState); }
  showDetail(node);
});

/* ---- fan-out canvas -----------------------------------------------------
   The signature element, and a wiring diagram rather than a hairball: nodes are
   pulled toward their own lane, so the drawing reads left to right - what we
   define, where it is mirrored, and what consumes it. It aggregates on purpose.
   The per-definition detail is the matrix's job; this answers which harness is
   in trouble, at a glance. */
var sim = { raf: 0, positions: null, shape: null, tweening: false,
            tweenStart: 0 };

function buildGraph(state) {
  var nodes = [];
  var edges = [];
  var mirrors = state.mirrors || {};
  var byId = {};

  function push(node) {
    node.index = nodes.length;
    byId[node.id] = node;
    nodes.push(node);
    return node;
  }

  if (mirrors.status === "ok") {
    var counts = mirrors.counts || {};
    SOURCE_ORDER.forEach(function (source) {
      if (!counts[source]) { return; }
      push({ id: "src:" + source, lane: 0, label: SOURCE_LABEL[source],
             count: counts[source], alarm: false });
    });
    var harnesses = {};
    mirrors.columns.forEach(function (column) {
      (harnesses[column.harness] = harnesses[column.harness] || [])
        .push(column);
    });
    Object.keys(harnesses).forEach(function (harness) {
      var columns = harnesses[harness];
      var absent = columns.every(function (c) { return !c.installed; });
      push({ id: "har:" + harness, lane: 1, label: short(harness),
             count: null, alarm: false, absent: absent });
    });
    mirrors.rows.forEach(function (row) {
      var column = mirrors.columns.filter(function (c) {
        return c.id === row.target;
      })[0];
      if (!column) { return; }
      var from = byId["src:" + row.source];
      var to = byId["har:" + column.harness];
      if (!from || !to) { return; }
      var key = from.id + ">" + to.id;
      var edge = edges.filter(function (e) { return e.key === key; })[0];
      if (!edge) {
        edge = { key: key, from: from.index, to: to.index, count: 0,
                 broken: 0, kind: "mirror", problems: [] };
        edges.push(edge);
      }
      edge.count += 1;
      if (PROBLEM_STATES[row.state.value]) {
        edge.broken += 1;
        /* WHICH mirror, kept on the edge itself. The label reads `1 lost` and
           the plan's worked example is exactly this: the number was reachable
           and the name behind it was not. */
        edge.problems.push({ name: row.name, state: row.state.value,
                             target: column.id });
        from.alarm = true;
        to.alarm = true;
      }
    });
  }

  var fleet = state.fleet || {};
  (fleet.installed || []).forEach(function (id) {
    var harness = (fleet.harnesses || {})[id] || {};
    var sessions = (harness.sessions || []).length;
    var node = push({ id: "run:" + id, lane: 2,
                      label: harness.label || id, count: sessions,
                      alarm: false });
    /* Claude Code consumes the canonical tree directly rather than a mirror of
       it, which is why it has no column in the matrix. Drawing that edge is the
       honest way to show it, instead of leaving the node unconnected. */
    if (id === "claude_code") {
      SOURCE_ORDER.forEach(function (source) {
        var from = byId["src:" + source];
        if (from) {
          edges.push({ key: from.id + ">" + node.id, from: from.index,
                       to: node.index, count: 0, broken: 0,
                       kind: "canonical" });
        }
      });
    } else {
      var harnessNode = Object.keys(byId).filter(function (key) {
        return key.indexOf("har:") === 0
          && key.toLowerCase().indexOf("copilot") > 0;
      })[0];
      if (harnessNode) {
        edges.push({ key: byId[harnessNode].id + ">" + node.id,
                     from: byId[harnessNode].index, to: node.index,
                     count: 0, broken: 0, kind: "canonical" });
      }
    }
  });

  var services = state.services || {};
  if (services.status === "ok") {
    var runner = byId["run:claude_code"];
    var mcp = state.mcp || {};
    var models = services.local_models || {};
    var daemon = services.vault_daemon || {};
    [["mcp", "MCP", (mcp.counts || {}).connected,
      mcp.status === "ok" && !!(mcp.counts || {}).failed],
     ["models", "Local models", models.resident_count,
      models.status !== "ok"],
     ["daemon", "Vault daemon", (daemon.queue || {}).raw,
      daemon.status === "ok" && !daemon.running]
    ].forEach(function (spec) {
      var node = push({ id: "svc:" + spec[0], lane: 3, label: spec[1],
                        count: spec[2], alarm: spec[3] });
      if (runner) {
        edges.push({ key: runner.id + ">" + node.id, from: runner.index,
                     to: node.index, count: 0, broken: 0, kind: "service" });
      }
    });
  }
  return { nodes: nodes, edges: edges };
}

function nodeSize(node) {
  var extra = (node.count !== null && node.count !== undefined) ? 20 : 12;
  return { w: Math.max(62, Math.round(node.label.length * 5.7) + extra), h: 20 };
}

var LANE_GAP = 10;
var LANE_NAMES = ["defined", "mirrored to", "consumed by", "services"];

function usedLanes(graph) {
  var seen = {};
  graph.nodes.forEach(function (node) { seen[node.lane] = 1; });
  return Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
}

/* Lanes are POSITIONS, not a suggestion. The first draft simulated the lane
   axis too and the drawing came out as overlapping boxes. So the lane axis is
   pinned, only the free axis is simulated, and a lane whose nodes do not fit
   along the free axis is split into sub-rows rather than crushed - measured at
   385px, where eight nodes in one row overlapped four labels.
   Below a configured width the axes swap entirely: four lanes cannot sit across
   a narrow panel, and a diagram shrunk to illegibility is worse than a turned
   one. */
function planLanes(graph, laneSpan, freeSpan, vertical) {
  var byLane = {};
  graph.nodes.forEach(function (node) {
    var size = nodeSize(node);
    node.w = size.w;
    node.h = size.h;
    (byLane[node.lane] = byLane[node.lane] || []).push(node);
  });

  var freeOf = function (node) { return vertical ? node.w : node.h; };
  var laneOf = function (node) { return vertical ? node.h : node.w; };
  var capacity = Math.max(60, freeSpan - 16);
  var plan = {};
  var lanes = usedLanes(graph);

  lanes.forEach(function (lane) {
    var nodes = byLane[lane];
    var needed = nodes.reduce(function (sum, node) {
      return sum + freeOf(node) + LANE_GAP;
    }, 0);
    var subRows = Math.max(1, Math.ceil(needed / capacity));
    var thick = nodes.reduce(function (most, node) {
      return Math.max(most, laneOf(node));
    }, 0);
    /* Fill each sub-row until the next node would not fit, so a wrapped lane
       reads left to right like the text around it. */
    var used = 0;
    var sub = 0;
    nodes.forEach(function (node) {
      var extent = freeOf(node) + LANE_GAP;
      if (used + extent > capacity && sub < subRows - 1) {
        sub += 1;
        used = 0;
      }
      node.sub = sub;
      used += extent;
    });
    plan[lane] = {
      subRows: subRows,
      step: thick + LANE_GAP,
      extent: thick * subRows + LANE_GAP * (subRows - 1)
    };
  });

  var total = lanes.reduce(function (sum, lane) {
    return sum + plan[lane].extent;
  }, 0);
  var gaps = Math.max(1, lanes.length - 1);
  var slack = Math.max(gaps * 18, laneSpan - total - 24);
  var step = slack / gaps;
