<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rt-observe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23e3e6e2'/%3E%3Cpath d='M2.5 13.5h11M2.5 3.5h7M2.5 8.5h9' stroke='%231b2430' stroke-width='1.4'/%3E%3C/svg%3E">
<!--
  rt_state.html - the rt-observe dashboard.

  Served from a loopback socket by rt_server.py. No CDN, no npm, no build step,
  and no network at render time: the type system is a platform stack and the only
  script is the one below.

  The direction and the token values are documented in assets/rt-tokens.css at
  the repository root, which is the shared file other emitters can adopt. The
  :root blocks below are that file, inlined so this page still renders if it is
  ever opened without its server, and test_rt_view.py asserts the two agree
  token for token - one truth with a mechanical check rather than two copies.

  Two placeholders are filled in by the server at request time:
  __RT_SESSION_TOKEN__ and __RT_VIEW_CONFIG__. Every number the page uses
  arrives in that second one, so the markup carries no configured value (R0).
-->
<style>
/* ---- tokens: mirror of assets/rt-tokens.css ------------------------------ */
:root {
  color-scheme: light;
  --rt-ground: #e3e6e2;
  --rt-ink: #1b2430;
  --rt-muted: #5a6560;
  --rt-line: #a9b2ac;
  --rt-hatch: #8b968f;
  --rt-blueprint: #2b5f87;
  --rt-alarm: #c0322f;
  --rt-panel: color-mix(in oklab, var(--rt-ground) 97%, var(--rt-ink));
  --rt-sunken: color-mix(in oklab, var(--rt-ground) 93%, var(--rt-ink));
  --rt-wash: color-mix(in oklab, var(--rt-ground) 88%, var(--rt-blueprint));
  --rt-alarm-wash: color-mix(in oklab, var(--rt-ground) 82%, var(--rt-alarm));
  --rt-face-utility: "Bahnschrift SemiCondensed", "Bahnschrift",
    "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed",
    "DejaVu Sans Condensed", system-ui, sans-serif;
  --rt-face-body: "Segoe UI", -apple-system, "Cantarell", "Helvetica Neue",
    sans-serif;
  --rt-face-receipt: "Cascadia Mono", "Cascadia Code", ui-monospace, "SF Mono",
    "DejaVu Sans Mono", monospace;
  /* 10px, not 9: the audit measured a 9px rendered floor and this page is
     read mid-task. t9 and t10 share a value today and differ in ROLE - t9 is a
     micro label inside a title block, t10 is small UI text. */
  --rt-t9: 10px;
  --rt-t10: 10px;
  --rt-t11: 11px;
  --rt-t12: 12px;
  --rt-t13: 13px;
  --rt-t15: clamp(14px, 1.1vw, 15px);
  --rt-t19: clamp(17px, 1.6vw, 19px);
  --rt-t26: clamp(21px, 2.4vw, 26px);
  --rt-s1: 3px;
  --rt-s2: 6px;
  --rt-s3: 10px;
  --rt-s4: 16px;
  --rt-s5: 24px;
  --rt-s6: 36px;
  --rt-radius: 3px;
  --rt-radius-lg: 8px;
  /* Tool identity, never severity. Four families, so a reader can tell a shell
     call from a file write at a glance without reading either label; the alarm
     hue stays reserved for the one state that must never be missed. */
  --rt-tool-run: #b5761f;
  --rt-tool-read: #2f6f9f;
  --rt-tool-write: #3f7d4f;
  --rt-tool-net: #7a5aa8;
  /* One colour per token budget, so a ring and its bar are read as the same
     measurement. Full is orange in all three, which is why orange is not one of
     the three: a bar cannot be full of itself. */
  --rt-budget-session: #1f6b3a;
  --rt-budget-week: #1e4f8a;
  --rt-budget-supplement: #8a6d1e;
  --rt-budget-full: #e0761f;
  --rt-budget-figure: #7fc8ee;
  /* The one accent that is not a status. It marks MOTION - the marker running
     along an edge the flow is travelling right now - and never severity, so it
     does not compete with the alarm and does not have to be distinguishable
     from it under a colour vision deficiency: nothing is decided by seeing it. */
  --rt-runner: #d8862a;
  --rt-ease-quart: cubic-bezier(0.25, 1, 0.5, 1);
  --rt-ease-quint: cubic-bezier(0.22, 1, 0.36, 1);
  --rt-ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --rt-dur-tap: 120ms;
  --rt-dur-state: 220ms;
  --rt-dur-enter: 420ms;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --rt-ground: #101f2b;
    --rt-ink: #dde4e6;
    --rt-muted: #8fa2ab;
    --rt-line: #33505f;
    --rt-hatch: #52707f;
    --rt-blueprint: #86bbde;
    --rt-alarm: #e4645e;
    --rt-panel: color-mix(in oklab, var(--rt-ground) 94%, var(--rt-ink));
    --rt-sunken: color-mix(in oklab, var(--rt-ground) 88%, #000);
    --rt-wash: color-mix(in oklab, var(--rt-ground) 86%, var(--rt-blueprint));
    --rt-alarm-wash: color-mix(in oklab, var(--rt-ground) 78%, var(--rt-alarm));
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --rt-ground: #101f2b;
  --rt-ink: #dde4e6;
  --rt-muted: #8fa2ab;
  --rt-line: #33505f;
  --rt-hatch: #52707f;
  --rt-blueprint: #86bbde;
  --rt-alarm: #e4645e;
  --rt-panel: color-mix(in oklab, var(--rt-ground) 94%, var(--rt-ink));
  --rt-sunken: color-mix(in oklab, var(--rt-ground) 88%, #000);
  --rt-wash: color-mix(in oklab, var(--rt-ground) 86%, var(--rt-blueprint));
  --rt-alarm-wash: color-mix(in oklab, var(--rt-ground) 78%, var(--rt-alarm));
}

/* ---- sheet --------------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
/* The dashboard is ONE screen. The page itself never scrolls: the sheet IS the
   viewport, and anything longer than the pane it sits in scrolls inside that
   pane. That is Phase 9's acceptance test, and it is enforced here rather than
   hoped for by keeping content short - content grows, a rule does not. */
html, body { height: 100%; overflow: hidden; }
body {
  background-color: var(--rt-ground);
  /* The drafting grid. It sits on the page ground only, never inside a panel,
     and at this opacity it reads as paper rather than as a table. */
  background-image:
    repeating-linear-gradient(0deg,
      color-mix(in oklab, var(--rt-ground) 96%, var(--rt-ink)) 0 1px,
      transparent 1px 8px),
    repeating-linear-gradient(90deg,
      color-mix(in oklab, var(--rt-ground) 96%, var(--rt-ink)) 0 1px,
      transparent 1px 8px);
  color: var(--rt-ink);
  font-family: var(--rt-face-body);
  font-size: var(--rt-t12);
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
.sheet {
  max-width: 1680px;
  height: 100%;
  margin: 0 auto;
  padding: var(--rt-s3);
  display: flex;
  flex-direction: column;
}
.sheet-frame {
  border: 1px solid var(--rt-line);
  /* The drawing sheet's border-in-border, in one shadow rather than a wrapper. */
  box-shadow: inset 0 0 0 3px var(--rt-ground), inset 0 0 0 4px var(--rt-line);
  background: var(--rt-panel);
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

/* ---- head ---------------------------------------------------------------- */
.head {
  display: flex;
  align-items: baseline;
  gap: var(--rt-s4);
  flex-wrap: wrap;
  padding: var(--rt-s3) var(--rt-s4);
  border-bottom: 1px solid var(--rt-line);
}
.wordmark {
  margin: 0;
  font-weight: 400;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t26);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  line-height: 1;
  white-space: nowrap;
}
.wordmark b { font-weight: 700; }
.wordmark span { color: var(--rt-muted); font-weight: 400; }
.head-id {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t12);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
.head-id b { color: var(--rt-ink); font-weight: 600; }
.head-alarm {
  margin-left: auto;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t13);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rt-ground);
  background: var(--rt-alarm);
  padding: var(--rt-s1) var(--rt-s3);
}
.head-ok {
  margin-left: auto;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t12);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rt-muted);
}

/* Theme control. Quiet by construction: it is a preference, not a finding, so
   it wears the same hairline as any other secondary control and never competes
   with the alarm badge beside it. */
.refresh {
  align-self: center;
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: var(--rt-s2);
  white-space: nowrap;
}
.refresh input {
  font: inherit;
  color: inherit;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rt-line);
  padding: 0 2px;
  /* Wide enough to READ, and with the browser's spinner removed: at 5ch with a
     datalist triangle over it, the value was invisible. */
  width: 8ch;
  text-align: right;
  appearance: textfield;
  -webkit-appearance: textfield;
}
.refresh input::-webkit-outer-spin-button,
.refresh input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
.refresh input:focus-visible { outline: 2px solid var(--rt-blueprint); }
.theme {
  margin-left: var(--rt-s3);
  align-self: center;
  white-space: nowrap;
}
.theme b {
  font-weight: 700;
  letter-spacing: 0.12em;
}

/* ---- layout -------------------------------------------------------------- */
/* Two columns, each tabbed independently: the sheet's own views on the left,
   the rail's six panels on the right. Both columns are min-height 0 all the way
   down, which is what lets an over-long panel scroll inside itself instead of
   growing the page. */
.body {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  grid-template-areas: "main rail";
}
.a-main {
  grid-area: main;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
}
.a-rail {
  grid-area: rail;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
@media (max-width: 1080px) {
  .body {
    grid-template-columns: minmax(0, 1fr);
    /* The rail keeps a share of the height rather than being pushed off the
       bottom: one screen means both columns stay on it. */
    grid-template-rows: minmax(0, 1fr) minmax(0, 38%);
    grid-template-areas: "main" "rail";
  }
}

/* ---- tabs ---------------------------------------------------------------
   One component, two independent strips. The main strip decides what the sheet
   shows, the rail strip decides what the right column shows, and neither knows
   about the other. A tab is a button, not a link: nothing here is a document
   location, and nothing here navigates. */
.tabs {
  display: flex;
  flex: 0 0 auto;
  border-bottom: 1px solid var(--rt-line);
  overflow-x: auto;
}
.tab {
  appearance: none;
  border: 0;
  border-right: 1px solid var(--rt-line);
  background: transparent;
  color: var(--rt-muted);
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t11);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: var(--rt-s2) var(--rt-s4);
  cursor: pointer;
  white-space: nowrap;
}
.tab:hover { color: var(--rt-ink); }
.tab:focus-visible { outline: 2px solid var(--rt-blueprint); outline-offset: -2px; }
.tab[aria-selected="true"] {
  color: var(--rt-ink);
  background: var(--rt-ground);
  box-shadow: inset 0 -2px 0 var(--rt-blueprint);
}
/* The rail is 320px and carries six tabs, so this strip WRAPS rather than
   scrolls. A tab you have to scroll sideways to discover is a tab nobody
   finds: measured here, Actions sat off the end of the strip. */
.tabs--rail { flex-wrap: wrap; overflow-x: hidden; }
.tabs--rail .tab {
  padding: var(--rt-s2) var(--rt-s3);
  border-bottom: 1px solid var(--rt-line);
  margin-bottom: -1px;
}

/* A hidden pane is display:none rather than merely transparent, so nothing in
   it is measured, tabbed into, or read out. The canvas pays for that - a hidden
   element has width 0 - and the tab switch re-lays it out for exactly that
   reason. */
.pane { display: none; flex: 1; min-height: 0; }
.pane[data-active="1"] { display: flex; flex-direction: column; }
.pane .panel-body { flex: 1; min-height: 0; overflow: auto; }

/* ---- panel --------------------------------------------------------------- */
.panel { min-width: 0; }
/* The matrix is the primary view, so its grid takes the leftover height of its
   pane and the legend, detail and receipt sit under it at their own size. */
.a-matrix .panel-body { display: flex; flex-direction: column; }
.a-rail { border-left: 1px solid var(--rt-line); }
@media (max-width: 1080px) {
  .a-rail { border-left: 0; border-top: 1px solid var(--rt-line); }
}
#rail { flex: 1; min-height: 0; overflow-y: auto; }
/* Only the rail tab in front is drawn. The state deciding which lives in a
   module variable, never in this markup, because the rail is morphed on every
   poll and anything held here would be reconciled away. */
.rail-panel[data-active="0"] { display: none; }
.panel-head {
  display: flex;
  align-items: baseline;
  gap: var(--rt-s3);
  padding: var(--rt-s2) var(--rt-s4);
  border-bottom: 1px solid
    color-mix(in oklab, var(--rt-line) 60%, transparent);
}
.panel-title {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t11);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.panel-note { font-size: var(--rt-t11); color: var(--rt-muted); }
.panel-body { padding: var(--rt-s3) var(--rt-s4) var(--rt-s2); }

/* The title block: a drawing's own receipt, and the reason this page can be
   trusted rather than merely read. Fields, not a badge. */
.tblock {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border-top: 1px solid
    color-mix(in oklab, var(--rt-line) 60%, transparent);
  margin-top: var(--rt-s2);
}
.tblock div {
  padding: var(--rt-s1) var(--rt-s3) var(--rt-s1) 0;
  margin-right: var(--rt-s3);
  border-right: 1px solid
    color-mix(in oklab, var(--rt-line) 45%, transparent);
}
.tblock div:last-child { border-right: 0; }
.tblock span {
  display: block;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
.rc {
  font-family: var(--rt-face-receipt);
  font-size: var(--rt-t10);
  font-weight: 400;
  font-variant-numeric: tabular-nums;
}
.tblock--stale span, .tblock--stale .rc { color: var(--rt-alarm); }

.unavail {
  border-left: 2px solid var(--rt-blueprint);
  padding-left: var(--rt-s3);
  color: var(--rt-muted);
  font-size: var(--rt-t11);
}
.unavail b {
  display: block;
  font-family: var(--rt-face-utility);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-size: var(--rt-t10);
  color: var(--rt-ink);
}

/* ---- matrix -------------------------------------------------------------- */
.mx-controls {
  display: flex;
  align-items: center;
  gap: var(--rt-s4);
  flex-wrap: wrap;
  margin-left: auto;
  font-size: var(--rt-t11);
}
.mx-controls label { display: flex; align-items: center; gap: var(--rt-s2); }
/* Grows into its pane and no further. The viewport cap this rule used to carry
   became redundant when the page stopped scrolling: the pane is already bounded
   by the sheet, so a second bound expressed in vh could only disagree with it. */
.mx-scroll {
  overflow-x: auto;
  overflow-y: auto;
  flex: 1;
  min-height: 160px;
}
.mx-group + .mx-group { margin-top: var(--rt-s4); }
.mx-group-head {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--rt-muted);
  padding-bottom: var(--rt-s1);
}
table.mx { border-collapse: collapse; width: 100%; }
table.mx th, table.mx td { padding: 0; text-align: left; }
table.mx thead th {
  vertical-align: bottom;
  padding: 0 var(--rt-s2) var(--rt-s1);
  border-bottom: 1px solid var(--rt-line);
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--rt-ink);
  white-space: nowrap;
}
table.mx thead th em {
  display: block;
  font-style: normal;
  font-size: var(--rt-t9);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
table.mx thead th i {
  font-style: normal;
  color: var(--rt-alarm);
  font-size: var(--rt-t9);
  letter-spacing: 0.08em;
}
table.mx tbody th {
  font-weight: 400;
  font-size: var(--rt-t11);
  padding: 0 var(--rt-s3) 0 0;
  white-space: nowrap;
  color: var(--rt-ink);
  border-bottom: 1px solid
    color-mix(in oklab, var(--rt-line) 32%, transparent);
}
table.mx tbody td {
  border-bottom: 1px solid
    color-mix(in oklab, var(--rt-line) 32%, transparent);
  width: 34px;
}
table.mx tbody tr:hover th { color: var(--rt-blueprint); }

.cell {
  appearance: none;
  display: block;
  width: 28px;
  height: 20px;
  margin: 2px 0;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--rt-ink);
  position: relative;
  transition: transform var(--rt-dur-tap) var(--rt-ease-quart);
}
.cell:hover { transform: scale(1.12); }
.cell:focus-visible { outline: 2px solid var(--rt-blueprint); outline-offset: 1px; }

/* Eight states. Colour marks exactly ONE of them, because on this surface no
   second hue cleared the CVD floors against the alarm red. Every state is
   readable with colour removed: a code, a texture, or an edge. */
.cell[data-state="ok"]::after {
  content: "";
  position: absolute;
  inset: 50% auto auto 50%;
  width: 3px; height: 3px;
  transform: translate(-50%, -50%);
  background: var(--rt-line);
}
.cell[data-state="by-design"] {
  background-image: repeating-linear-gradient(45deg,
    var(--rt-hatch) 0 1px, transparent 1px 4px);
  color: var(--rt-muted);
}
.cell[data-state="stubbed"],
.cell[data-state="trimmed"] {
  background: var(--rt-wash);
  border: 1px solid color-mix(in oklab, var(--rt-line) 80%, var(--rt-ink));
}
.cell[data-state="stale"] {
  background: var(--rt-wash);
  border: 1px solid color-mix(in oklab, var(--rt-line) 80%, var(--rt-ink));
  border-bottom: 2px solid var(--rt-blueprint);
}
.cell[data-state="lost"] {
  background: var(--rt-alarm);
  color: var(--rt-ground);
}
.cell[data-state="orphan"] {
  border: 2px solid var(--rt-alarm);
  color: var(--rt-alarm);
}
.cell[data-state="unknown"] {
  border: 1px dashed var(--rt-line);
  color: var(--rt-muted);
}
@keyframes rt-flash {
  from { box-shadow: 0 0 0 3px var(--rt-blueprint); }
  to   { box-shadow: 0 0 0 0 transparent; }
}
.cell--changed { animation: rt-flash var(--rt-dur-state) var(--rt-ease-quart); }

.legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rt-s1) var(--rt-s4);
  padding-top: var(--rt-s3);
  font-size: var(--rt-t10);
  color: var(--rt-muted);
}
.legend div { display: flex; align-items: center; gap: var(--rt-s2); }
.legend .cell { cursor: default; flex: 0 0 auto; }
.legend b {
  font-family: var(--rt-face-utility);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rt-ink);
  font-size: var(--rt-t10);
  font-weight: 600;
}

.mx-single { margin-top: var(--rt-s4); }
.mx-single ul { list-style: none; margin: 0; padding: 0; }
.mx-single li {
  display: flex;
  align-items: center;
  gap: var(--rt-s3);
  padding: var(--rt-s1) 0;
  border-bottom: 1px solid
    color-mix(in oklab, var(--rt-line) 32%, transparent);
  font-size: var(--rt-t11);
}
.mx-single li span { color: var(--rt-muted); }

.mx-detail {
  margin-top: var(--rt-s3);
  border-top: 1px solid var(--rt-line);
  padding-top: var(--rt-s2);
}
.mx-detail h3 {
  margin: 0 0 var(--rt-s2);
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t13);
  font-weight: 700;
  letter-spacing: 0.08em;
}
.mx-detail table { border-collapse: collapse; width: 100%; }
.mx-detail th, .mx-detail td {
  text-align: left;
  vertical-align: top;
  overflow-wrap: anywhere;
  padding: var(--rt-s1) var(--rt-s3) var(--rt-s1) 0;
  font-size: var(--rt-t11);
  border-bottom: 1px solid
    color-mix(in oklab, var(--rt-line) 32%, transparent);
}
.mx-detail thead th {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rt-muted);
  font-weight: 400;
}
.mx-detail .why { color: var(--rt-muted); }
.mx-detail-empty { color: var(--rt-muted); font-size: var(--rt-t11); }

/* ---- canvas -------------------------------------------------------------- */
.a-canvas .panel-body { display: flex; flex-direction: column; }
/* Takes the height the tab has left, and no more. Upright the drawing computes
   a height of its own that can exceed that, so this is where it scrolls: the
   PAGE never does. */
.canvas-wrap { position: relative; flex: 1; min-height: 0; overflow: auto; }
/* Fills its wrapper rather than carrying a height of its own. Upright, the
   script gives it an explicit one instead - that is the single case where the
   drawing is taller than the tab, and the wrapper scrolls for it. */
svg.fanout { display: block; width: 100%; height: 100%; }
svg.fanout text {
  font-family: var(--rt-face-utility);
  fill: var(--rt-ink);
  letter-spacing: 0.06em;
}
svg.fanout .lane-label {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  fill: var(--rt-muted);
}
svg.fanout .edge {
  fill: none;
  stroke: color-mix(in oklab, var(--rt-line) 90%, var(--rt-ink));
  stroke-width: 1;
}
svg.fanout .edge--canonical {
  stroke: var(--rt-blueprint);
  stroke-width: 1.5;
}
svg.fanout .edge--alarm { stroke: var(--rt-alarm); stroke-width: 2; }
svg.fanout .node rect {
  fill: var(--rt-ground);
  stroke: var(--rt-ink);
  stroke-width: 1;
}
svg.fanout .node--alarm rect { stroke: var(--rt-alarm); stroke-width: 2; }
svg.fanout .node--absent rect { stroke-dasharray: 3 2; stroke: var(--rt-line); }
svg.fanout .node text { font-size: 10px; }
svg.fanout .node .count { fill: var(--rt-muted); font-size: 10px; }
svg.fanout .edge-label { font-size: 10px; fill: var(--rt-alarm); }

/* ---- rail ---------------------------------------------------------------- */
.rail-panel { padding: var(--rt-s3) var(--rt-s4); }
.rail-panel + .rail-panel { border-top: 1px solid var(--rt-line); }
.rail-title {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: var(--rt-s2);
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: var(--rt-s1) var(--rt-s3); }
.kv dt {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
.kv dd { margin: 0; font-size: var(--rt-t11); }
.kv dd.bad { color: var(--rt-alarm); font-weight: 600; }
.phases { list-style: none; margin: 0; padding: 0; }
.phases li {
  display: grid;
  grid-template-columns: 22px 1fr;
  gap: var(--rt-s2);
  padding: 1px 0;
  font-size: var(--rt-t11);
}
.phases li > div {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--rt-s3);
}
.phases .st { flex: 0 0 auto; }
.phases .num {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  color: var(--rt-muted);
  font-variant-numeric: tabular-nums;
}
.phases .st {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
.phases li[data-state="done"] .lbl { color: var(--rt-ink); }
.phases li[data-state="todo"] .lbl { color: var(--rt-muted); }
.phases li[data-state="unproven"] .st,
.phases li[data-state="unreported"] .st { color: var(--rt-alarm); }
.next {
  margin-top: var(--rt-s2);
  padding-top: var(--rt-s2);
  border-top: 1px solid color-mix(in oklab, var(--rt-line) 60%, transparent);
  font-size: var(--rt-t11);
}
.next span {
  display: block;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
.srv-list { list-style: none; margin: var(--rt-s2) 0 0; padding: 0; max-height: 148px; overflow-y: auto; }
.srv-list li {
  display: flex; justify-content: space-between; gap: var(--rt-s2);
  font-size: var(--rt-t10); padding: 1px 0;
}
.srv-list .s-failed { color: var(--rt-alarm); }
.srv-list .s-needs-auth { color: var(--rt-muted); }
.hooks {
  margin: 0;
  font-family: var(--rt-face-receipt);
  font-size: var(--rt-t9);
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
  color: var(--rt-muted);
  max-height: 132px;
  overflow-y: auto;
}
.hooks b { color: var(--rt-ink); font-weight: 400; }
.btn {
  appearance: none;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--rt-ink);
  background: transparent;
  border: 1px solid var(--rt-line);
  padding: var(--rt-s1) var(--rt-s3);
  cursor: pointer;
  transition: border-color var(--rt-dur-tap) var(--rt-ease-quart);
}
.btn:hover { border-color: var(--rt-ink); }
.btn:focus-visible { outline: 2px solid var(--rt-blueprint); outline-offset: 1px; }
.dispatch {
  font-family: var(--rt-face-receipt);
  font-size: var(--rt-t9);
  background: var(--rt-sunken);
  padding: var(--rt-s2);
  margin: var(--rt-s2) 0;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ---- actions -------------------------------------------------------------
   The write half. Everything here is a control, so it is the one place on this
   page where a hover, a focus ring and a disabled state carry meaning; the rest
   of the surface is a report. A destructive action arms before it runs, and the
   armed state is spelled out in words rather than only coloured, for the same
   reason the matrix carries two-letter codes. */
.act { padding: var(--rt-s2) 0; border-bottom: 1px dotted var(--rt-line); }
.act:last-of-type { border-bottom: 0; }
.act-head {
  display: flex; justify-content: space-between; gap: var(--rt-s2);
  align-items: baseline;
}
.act-name {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t11);
  font-weight: 700;
  letter-spacing: 0.04em;
}
.act-tag {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--rt-muted);
  white-space: nowrap;
}
.act-what {
  font-size: var(--rt-t10);
  color: var(--rt-muted);
  margin: var(--rt-s1) 0;
}
.act-why { font-size: var(--rt-t10); color: var(--rt-muted); margin: var(--rt-s1) 0; }
.act-row { display: flex; flex-wrap: wrap; gap: var(--rt-s2); margin-top: var(--rt-s1); }
.act-confirm {
  font-size: var(--rt-t10);
  border-left: 2px solid var(--rt-alarm);
  padding-left: var(--rt-s2);
  margin: var(--rt-s2) 0 var(--rt-s1);
}
.act-result { margin-top: var(--rt-s2); font-size: var(--rt-t10); }
.act-result .bad { color: var(--rt-alarm); font-weight: 600; }
.btn[disabled] { color: var(--rt-muted); cursor: progress; }
.compose {
  border: 1px solid var(--rt-ink);
  background: var(--rt-paper);
  color: var(--rt-ink);
  padding: var(--rt-s4);
  max-width: 52ch;
  width: calc(100vw - 2 * var(--rt-s4));
}
.compose::backdrop { background: rgba(0, 0, 0, 0.45); }
.compose h3 {
  margin: 0 0 var(--rt-s2);
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t13);
  letter-spacing: 0.06em;
}
.compose textarea {
  width: 100%;
  min-height: 7em;
  font: inherit;
  font-size: var(--rt-t11);
  color: var(--rt-ink);
  background: var(--rt-sunken);
  border: 1px solid var(--rt-line);
  padding: var(--rt-s2);
}
.compose textarea:focus-visible { outline: 2px solid var(--rt-blueprint); }
.compose-row { display: flex; gap: var(--rt-s2); margin-top: var(--rt-s3); }
.compose-note { font-size: var(--rt-t10); color: var(--rt-muted); margin: var(--rt-s2) 0 0; }

/* ---- fleet --------------------------------------------------------------- */
/*.fleet { display: flex; gap: 0; overflow-x: auto; }*/

.fleet { 
  display: flex; 
  flex-wrap: wrap; 
  gap: var(--rt-s2); 
}

/*.fleet { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
  gap: var(--rt-s2); 
  overflow-x: hidden; 
}*/

.fleet-card {
  flex: 0 0 268px;
  padding: var(--rt-s3) var(--rt-s4);
  border: 2px solid var(--rt-line);
  /*background: var(--rt-bg-card, #091110); */
  border-radius: 4px;
  min-width: 0;
  box-sizing: border-box;
}

.fleet-card:last-child { border-right: 0; }
.fleet-card h4 {
  margin: 0;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t12);
  font-weight: 700;
  letter-spacing: 0.06em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.fleet-meta {
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--rt-muted);
  margin: var(--rt-s1) 0 var(--rt-s2);
}
.fleet-prompt {
  font-size: var(--rt-t11);
  color: var(--rt-muted);
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.fleet-flags { margin-top: var(--rt-s2); font-size: var(--rt-t10); }
.fleet-flags .bad { color: var(--rt-alarm); font-weight: 600; }
.fleet-empty { padding: var(--rt-s4); max-width: 62ch; }
.fleet-empty h4 {
  margin: 0 0 var(--rt-s2);
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t15);
  letter-spacing: 0.06em;
}
.fleet-empty p { margin: 0 0 var(--rt-s2); color: var(--rt-muted); }

/* ---- real-time process ---------------------------------------------------
   The two figures this tab is drawn from (`c2:fig:hooks_states` and
   `c2:fig:superpowers_collab`) carry their meaning in colour. This page cannot:
   it was measured that a second status hue collapses under deuteranopia here,
   so the role of a state is carried by a two-letter code and a border weight,
   exactly as the matrix carries its eight states, and the only fill is the step
   running RIGHT NOW. */
.live { display: flex; flex-direction: column; gap: var(--rt-s3); }
.live-machine { overflow-x: auto; }
/* The height comes from the drawing, which stacks its hook names rather than
   laying them along one line: at one line they collided with the next box's
   and the strip could not be read. */
svg.machine { display: block; min-width: 660px; width: 100%; }
svg.machine text { font-family: var(--rt-face-utility); fill: var(--rt-ink); }
svg.machine .m-label { font-size: 10px; letter-spacing: 0.04em; }
svg.machine .m-role {
  font-size: 10px;
  letter-spacing: 0.14em;
  fill: var(--rt-muted);
}
svg.machine .m-box {
  fill: var(--rt-ground);
  stroke: var(--rt-ink);
  stroke-width: 1;
  rx: var(--rt-radius);
}
svg.machine .m-box--idle { stroke-dasharray: 3 2; stroke: var(--rt-line); }
svg.machine .m-box--core { stroke: var(--rt-blueprint); stroke-width: 1.6; }
svg.machine .m-box--live { fill: var(--rt-ink); }
svg.machine .m-live-text { fill: var(--rt-ground); }
svg.machine .m-edge { fill: none; stroke: var(--rt-line); stroke-width: 1; }
svg.machine .m-edge--travelled {
  stroke: var(--rt-ink);
  stroke-width: 2;
}
svg.machine .m-runner { fill: var(--rt-runner); }
svg.machine .m-edge-label {
  font-size: 10px;
  fill: var(--rt-muted);
  letter-spacing: 0.08em;
}
/* The figure's own idiom for a background process: a dashed self-loop over the
   box it runs on, labelled. RTK, caveman, the secret scan and the outbox flush
   are drawn exactly this way, because that is what they are - loops that repeat
   independently of the main flow. */
svg.machine .m-loop {
  fill: none;
  stroke: var(--rt-muted);
  stroke-width: 1;
  stroke-dasharray: 3 2;
}
svg.machine .m-loop--blocked { stroke: var(--rt-alarm); stroke-width: 1.6; }
svg.machine .m-loop-label { font-size: 10px; fill: var(--rt-muted); }
svg.machine .m-loop-label--blocked { fill: var(--rt-alarm); }
.live-hooks { display: flex; flex-wrap: wrap; gap: var(--rt-s2); margin-top: var(--rt-s2); }
.live-hook {
  border: 1px dashed var(--rt-line);
  border-radius: var(--rt-radius);
  padding: 1px var(--rt-s2);
  font-size: var(--rt-t10);
  color: var(--rt-muted);
  white-space: nowrap;
}
.live-hook--blocked { border-color: var(--rt-alarm); color: var(--rt-alarm); }
.live-sub { display: flex; flex-wrap: wrap; gap: var(--rt-s2); margin-top: var(--rt-s2); }

/* A card rather than a ruled row. The sheet's hairlines are the drawing
   surface's language; what sits ON it in this tab is read at a glance and gets
   a softer edge. */
.live-block {
  border: 1px solid var(--rt-line);
  border-radius: var(--rt-radius-lg);
  background: var(--rt-ground);
  padding: var(--rt-s3);
}
.fx-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--rt-s4);
  padding: 0 var(--rt-s2) var(--rt-s2);
  font-size: var(--rt-t10);
  color: var(--rt-muted);
}
.fx-legend-item { display: flex; align-items: center; gap: var(--rt-s2); }
.fx-legend-item b {
  font-weight: 400;
  font-family: var(--rt-face-utility);
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.fx-legend-mark { width: 14px; height: 12px; flex: 0 0 auto; }
.fx-legend-mark--agent {
  border: 1.5px solid #6fb2d8;
  background: #0f2029;
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}
.fx-legend-mark--call {
  border: 1px solid var(--rt-tool-run);
  background: #0e1a22;
  border-radius: var(--rt-radius-lg);
}
.fx-legend-mark--memory {
  border: 1px dashed var(--rt-line);
  background: var(--rt-sunken);
  border-radius: var(--rt-radius-lg);
}
/* The hook, at legend size: the same shank and bend the graph draws. */
.fx-legend-mark--hook {
  border-left: 1.5px solid var(--rt-muted);
  border-bottom: 1.5px solid var(--rt-muted);
  border-bottom-left-radius: 7px;
  width: 9px;
  margin-left: 3px;
}
.live-graph {
  border: 1px solid var(--rt-line);
  border-radius: var(--rt-radius-lg);
  background: var(--rt-ground);
  padding: var(--rt-s2);
  overflow-x: auto;
}
/* The canvas is its own surface, dark in both themes. The sheet around it is a
   drafting ground; this is an instrument panel, and the reference the operator
   asked for reads as one because the drawing glows against a dark field rather
   than sitting on paper. */
.live-graph {
  background:
    radial-gradient(1200px 400px at 20% 0%,
      color-mix(in oklab, #0d1b24 88%, var(--rt-blueprint)) 0%,
      #0b141b 60%, #080f14 100%);
  border-color: #16232c;
}
svg.flowgraph { display: block; width: 100%; }
svg.flowgraph text { fill: #cfe0e8; }
/* The agent: a hexagon inside a token ring, lit rather than outlined. */
svg.flowgraph .fx-hex {
  fill: color-mix(in oklab, #0f2029 80%, var(--rt-blueprint));
  stroke: #6fb2d8;
  stroke-width: 1.6;
  filter: url(#fxglow);
}
svg.flowgraph .fx-agent--idle .fx-hex { stroke: #46626f; }
/* Alive: the node breathes and sends a ping outward. Idle is still, which is
   the point - a panel where everything moves says nothing about what is
   working. */
svg.flowgraph .fx-agent--live .fx-hex {
  animation: fx-breathe 1.8s ease-in-out infinite;
}
svg.flowgraph .fx-ping {
  fill: none;
  stroke: var(--rt-budget-figure);
  stroke-width: 1.5;
}
@keyframes fx-breathe {
  0%, 100% { stroke-width: 1.6; }
  50% { stroke-width: 3.2; }
}
svg.flowgraph .fx-agent--subagent .fx-hex { stroke-dasharray: 5 3; }
svg.flowgraph .fx-ring-track {
  fill: none;
  stroke: #1b2c36;
  stroke-width: 3;
}
/* The ring IS the session bar, drawn round the agent: same measurement, same
   colour, so a glance at the graph answers which agent is eating the budget. */
svg.flowgraph .fx-ring {
  fill: none;
  stroke: var(--rt-budget-session);
  stroke-width: 3.5;
  stroke-linecap: round;
}
svg.flowgraph .fx-ring--full { stroke: var(--rt-budget-full); }
svg.flowgraph .fx-agent-state {
  font-size: 10px;
  fill: #9fd0e8;
  letter-spacing: 0.06em;
}
svg.flowgraph .fx-agent-name { font-size: 12px; fill: #e6f1f6; }
/* The number itself, in the one colour reserved for a figure rather than a
   state: it is read, not judged. */
svg.flowgraph .fx-agent-spend {
  font-size: 11px;
  fill: var(--rt-budget-figure);
}
/* A call: a labelled box on a curved wire, coloured by family. */
svg.flowgraph .fx-wire {
  fill: none;
  stroke: #33505f;
  stroke-width: 1.2;
  opacity: 0.85;
}
svg.flowgraph .fx-wire--out { stroke-dasharray: 4 4; opacity: 0.5; }
svg.flowgraph .fx-wire--run { stroke: var(--rt-tool-run); }
svg.flowgraph .fx-wire--read { stroke: var(--rt-tool-read); }
svg.flowgraph .fx-wire--write { stroke: var(--rt-tool-write); }
svg.flowgraph .fx-wire--net { stroke: var(--rt-tool-net); }
svg.flowgraph .fx-wire--skill { stroke: #7fb9d8; }
svg.flowgraph .fx-call rect {
  fill: #0e1a22;
  stroke: #33505f;
  stroke-width: 1;
  rx: var(--rt-radius-lg);
}
svg.flowgraph .fx-call text { font-size: 11px; }
svg.flowgraph .fx-call-count {
  font-size: 10px;
  fill: #7f97a3;
  font-weight: 700;
}
svg.flowgraph .fx-call-at { font-size: 9.5px; fill: #6f8794; }
/* Quiet by default, full colour and alive when the agent is using it. A tool
   that ran an hour ago and a tool running right now were the same box, which is
   the difference this panel exists to show. */
svg.flowgraph .fx-call--quiet { opacity: 0.45; }
svg.flowgraph .fx-call--live rect {
  stroke-width: 1.8;
  animation: fx-pulse 1.6s ease-in-out infinite;
}
svg.flowgraph .fx-wire--quiet { opacity: 0.3; }
svg.flowgraph .fx-wire--live {
  stroke-width: 2;
  animation: fx-pulse 1.6s ease-in-out infinite;
}
@keyframes fx-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.45; }
}
svg.flowgraph .fx-call--run rect { stroke: var(--rt-tool-run); }
svg.flowgraph .fx-call--run text { fill: #e2b671; }
svg.flowgraph .fx-call--read rect { stroke: var(--rt-tool-read); }
svg.flowgraph .fx-call--read text { fill: #8ec3e6; }
svg.flowgraph .fx-call--write rect { stroke: var(--rt-tool-write); }
svg.flowgraph .fx-call--write text { fill: #8ecb9d; }
svg.flowgraph .fx-call--net rect { stroke: var(--rt-tool-net); }
svg.flowgraph .fx-call--net text { fill: #bda6e0; }
svg.flowgraph .fx-call--skill rect { stroke: #7fb9d8; fill: #10222c; }
svg.flowgraph .fx-call--skill text { fill: #b7e0f2; }
svg.flowgraph .fx-call--picked rect { stroke-width: 2; }
svg.flowgraph .fx-call:focus-visible rect { stroke-width: 2; }
svg.flowgraph .fx-spawn {
  fill: none;
  stroke: #3d5f70;
  stroke-width: 1.4;
  stroke-dasharray: 5 4;
}
svg.flowgraph .fx-hook { stroke: #7f97a3; }
svg.flowgraph .fx-hook--blocked { stroke: var(--rt-alarm); }
svg.flowgraph .fx-hook-label { fill: #6f8794; font-size: 10px; }
/* A hook that FIRED is bold; one merely declared stays quiet. The operator
   could not tell the two apart, and that difference is the column's whole
   subject. */
svg.flowgraph .fx-hook-label--fired { fill: #cfe0e8; font-weight: 700; }
svg.flowgraph .fx-hook-label--blocked { fill: var(--rt-alarm); font-weight: 700; }
/* A failure is a RESULT, and it was the one result that could not be tracked.
   Marked by a triangle as well as by colour, so it survives a colour vision
   deficiency - the same reason the matrix carries two-letter codes. */
svg.flowgraph .fx-fail { fill: var(--rt-alarm); }
svg.flowgraph .fx-wire--failed { stroke: var(--rt-alarm); opacity: 1; }
svg.flowgraph .fx-call--failed rect { stroke: var(--rt-alarm); stroke-width: 1.6; }
svg.flowgraph .fx-call--failed text { fill: #f0b7b5; }
svg.flowgraph .fx-shared-box {
  fill: #0e1a22;
  stroke: #33505f;
  rx: var(--rt-radius-lg);
}
svg.flowgraph .fx-shared-label { fill: #cfe0e8; font-size: 11px; }
svg.flowgraph .fx-shared-count {
  fill: var(--rt-budget-figure);
  font-size: 11px;
  font-weight: 700;
}
svg.flowgraph .fx-link {
  fill: none;
  stroke: #2b4a5c;
  stroke-width: 1;
  opacity: 0.6;
}
svg.flowgraph .fx-more { fill: #6f8794; font-size: 10px; }
svg.flowgraph .fx-empty { fill: #6f8794; font-size: 11px; }
svg.flowgraph text {
  font-family: var(--rt-face-utility);
  fill: var(--rt-ink);
  font-size: 10px;
}
svg.flowgraph .fx-lane-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
svg.flowgraph .fx-lane-kind {
  font-size: 10px;
  fill: var(--rt-muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
svg.flowgraph .fx-spine {
  stroke: var(--rt-line);
  stroke-width: 1.5;
  stroke-linecap: round;
}
/* The bracket that hangs a subagent off the line that spawned it. */
svg.flowgraph .fx-spawn {
  fill: none;
  stroke: var(--rt-line);
  stroke-width: 1.5;
  stroke-dasharray: 4 3;
}
/* A BOX is an actor - a line, a skill, a memory. A tool call is not an actor,
   so it is a tick on the line and a run of the same tool is one tick carrying
   its count. Drawn as boxes, `Bash`, `Bash`, `tool result` read as three
   entities, which is three things that are not there. */
svg.flowgraph .fx-actor rect {
  fill: var(--rt-panel);
  stroke: var(--rt-line);
  stroke-width: 1;
  rx: var(--rt-radius-lg);
}
svg.flowgraph .fx-actor--subagent rect { stroke-dasharray: 4 3; }
svg.flowgraph .fx-actor:focus-visible rect {
  stroke: var(--rt-blueprint);
  stroke-width: 2;
}
/* The result edge: solid once the output came back, dashed while the call is
   still out. It is the same arrow the state strip draws from `tool call` to
   `PostToolUse`. */
svg.flowgraph .fx-return {
  stroke: var(--rt-ink);
  stroke-width: 1.5;
  stroke-linecap: round;
}
svg.flowgraph .fx-return--out {
  stroke: var(--rt-muted);
  stroke-dasharray: 3 3;
}
svg.flowgraph .fx-tick line {
  stroke: var(--rt-muted);
  stroke-width: 1.5;
  stroke-linecap: round;
}
svg.flowgraph .fx-tick text { fill: var(--rt-muted); font-size: 10px; }
/* Input and output are told apart by DIRECTION and by shape, never by colour
   alone: a wedge arriving at the line, an arrowhead travelling along it. */
svg.flowgraph .fx-in { fill: var(--rt-blueprint); }
svg.flowgraph .fx-out { fill: var(--rt-ink); }
svg.flowgraph .fx-tick--net line { stroke: var(--rt-blueprint); }
svg.flowgraph .fx-tick--net text { fill: var(--rt-blueprint); }
svg.flowgraph .fx-tick--now line { stroke: var(--rt-ink); stroke-width: 2; }
svg.flowgraph .fx-tick--now text { fill: var(--rt-ink); font-weight: 700; }
svg.flowgraph .fx-tick--now circle { fill: var(--rt-ink); }
svg.flowgraph .fx-tick--picked line { stroke: var(--rt-blueprint); stroke-width: 2.5; }
svg.flowgraph .fx-tick:focus-visible line { stroke: var(--rt-blueprint); stroke-width: 2.5; }
/* A dispatch is a mark on the parent line: the subagent itself is the line
   below, so this is only where it was spawned. */
svg.flowgraph .fx-dispatch circle {
  fill: var(--rt-ground);
  stroke: var(--rt-ink);
  stroke-width: 1.5;
}
svg.flowgraph .fx-dispatch text { fill: var(--rt-ink); font-size: 10px; }
/* A skill changes what a line is following, so it sits above the line in a box
   of its own, joined to the step that invoked it. */
svg.flowgraph .fx-skill rect {
  fill: var(--rt-wash);
  stroke: var(--rt-blueprint);
  stroke-width: 1;
  rx: var(--rt-radius-lg);
}
svg.flowgraph .fx-join { stroke: var(--rt-blueprint); stroke-width: 1; }
/* An actual hook. Deterministic, so it is drawn in the quiet ink and turns to
   alarm only when it REFUSED a call. */
svg.flowgraph .fx-hook {
  fill: none;
  stroke: var(--rt-muted);
  stroke-width: 1.6;
  stroke-linecap: round;
}
svg.flowgraph .fx-hook--blocked { stroke: var(--rt-alarm); stroke-width: 2.2; }
svg.flowgraph .fx-hook-label { fill: var(--rt-muted); font-size: 10px; }
svg.flowgraph .fx-shared-box {
  fill: var(--rt-sunken);
  stroke: var(--rt-line);
  stroke-width: 1;
  rx: var(--rt-radius-lg);
}
svg.flowgraph .fx-shared-label { fill: var(--rt-ink); }
svg.flowgraph .fx-link {
  fill: none;
  stroke: var(--rt-blueprint);
  stroke-width: 1;
  opacity: 0.55;
}
svg.flowgraph .fx-empty { fill: var(--rt-muted); font-size: 10px; }
.live-lane { border-top: 1px solid var(--rt-line); padding-top: var(--rt-s2); }
.live-head {
  display: flex;
  align-items: baseline;
  gap: var(--rt-s3);
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t11);
  letter-spacing: 0.06em;
}
.live-head b { font-weight: 700; }
.live-head span { color: var(--rt-muted); font-size: var(--rt-t10); }
.live-steps { display: flex; flex-wrap: wrap; gap: var(--rt-s2); margin-top: var(--rt-s2); }
.live-chip {
  border: 1px solid var(--rt-line);
  border-radius: var(--rt-radius);
  padding: 2px var(--rt-s2);
  font-size: var(--rt-t10);
  /* History stays on screen, in low grey, rather than being lost. */
  color: var(--rt-muted);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
}
.live-chip--now {
  border-color: var(--rt-ink);
  background: var(--rt-ink);
  color: var(--rt-ground);
}
.live-chip--picked { border-color: var(--rt-blueprint); color: var(--rt-ink); }
.live-chip--sub { margin-left: var(--rt-s4); border-style: dashed; }
.live-chip em { font-style: normal; color: var(--rt-alarm); }
.live-bar {
  margin-top: var(--rt-s2);
  height: 6px;
  background: var(--rt-sunken);
  border-radius: var(--rt-radius);
  overflow: hidden;
  flex: 1;
  min-width: 60px;
}
.live-bar i { display: block; height: 100%; background: var(--rt-blueprint); }
/* One colour per budget: what a session holds, what the week has spent, what
   the paid supplement has run to. The agent's ring uses the session colour, so
   the ring and the bar are visibly the same measurement. */
.live-bar--session i { background: var(--rt-budget-session); }
.live-bar--week i { background: var(--rt-budget-week); }
.live-bar--supplement i { background: var(--rt-budget-supplement); }
/* Full is the one state that must be unmissable, since it is what makes the
   third bar appear at all - and it outranks the budget's own colour. */
.live-bar--full i { background: var(--rt-budget-full); }
.live-meter { display: flex; align-items: center; gap: var(--rt-s2); margin-top: var(--rt-s2); }
.live-meter > span {
  flex: 0 0 auto;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rt-muted);
  min-width: 7ch;
}
.live-meter b { font-weight: 400; font-size: var(--rt-t10); white-space: nowrap; }
.live-meter input {
  font: inherit;
  font-size: var(--rt-t10);
  color: inherit;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--rt-line);
  width: 7ch;
  text-align: right;
  padding: 0 2px;
}
.live-meter input:focus-visible { outline: 2px solid var(--rt-blueprint); }
.live-spend--none { color: var(--rt-muted); }
.live-spend { font-size: var(--rt-t10); color: var(--rt-muted); margin-top: var(--rt-s1); }

/* ---- sheet block (footer) ------------------------------------------------ */
.foot {
  display: flex; flex-wrap: wrap; gap: 0;
  border-top: 1px solid var(--rt-line);
}
.foot div {
  padding: var(--rt-s2) var(--rt-s4);
  border-right: 1px solid var(--rt-line);
}
.foot div:last-child { border-right: 0; margin-left: auto; }
.foot span {
  display: block;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t9);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--rt-muted);
}

/* ---- tooltip ------------------------------------------------------------- */
/* ---- interaction layer ---------------------------------------------------
   Rounded corners on every OBJECT - a cell, a card, a control, a node in the
   diagram - and never on the sheet or its panels, which are the drawing surface
   and not boxes sitting on it. One token, so the whole page turns the same
   corner. */
.cell, .btn, .fleet-card, .unavail, .tblock, .tip, .mx-detail, .compose,
.act-confirm, .act-result, .next, .hooks, .srv-list li {
  border-radius: var(--rt-radius);
}
.tab { border-radius: var(--rt-radius) var(--rt-radius) 0 0; }
svg.fanout .node rect { rx: var(--rt-radius); }

/* Every object that can explain itself says so with the cursor, and the
   diagram's boxes can be moved. `touch-action` is what makes a drag a drag on
   a touch screen rather than a scroll of the pane under it. */
[data-detail] { cursor: help; }
svg.fanout { touch-action: none; }
svg.fanout .node { cursor: grab; }
svg.fanout .node:focus-visible rect { stroke: var(--rt-blueprint); stroke-width: 2; }
svg.fanout.rt-dragging .node { cursor: grabbing; }
svg.fanout .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: help; }
.tip-line { display: flex; gap: var(--rt-s2); margin-top: var(--rt-s1); }
.tip-line span {
  flex: 0 0 auto;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--rt-muted);
}
.tip-line em { font-style: normal; }
.tip {
  position: fixed;
  z-index: 20;
  max-width: 34ch;
  padding: var(--rt-s2) var(--rt-s3);
  background: var(--rt-ground);
  border: 1px solid var(--rt-ink);
  font-size: var(--rt-t11);
  pointer-events: none;
  opacity: 0;
  transition: opacity var(--rt-dur-tap) var(--rt-ease-quart);
}
.tip[data-show="1"] { opacity: 1; }
.tip b {
  display: block;
  font-family: var(--rt-face-utility);
  font-size: var(--rt-t10);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.tip em { font-style: normal; color: var(--rt-muted); }

/* ---- entrance: one orchestrated moment, then stillness ------------------- */
@keyframes rt-enter {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: none; }
}
.panel, .rail-panel {
  animation: rt-enter var(--rt-dur-enter) var(--rt-ease-expo) both;
}
.pane { animation-delay: 0ms; }
.a-rail .rail-panel { animation-delay: 60ms; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
  .cell:hover { transform: none; }
}
</style>
</head>
<body>
<div class="sheet">
  <div class="sheet-frame">
    <header class="head">
      <h1 class="wordmark"><b>rt</b><span>observe</span></h1>

      <div class="head-ok" id="head-verdict"></div>
      <label class="btn refresh" for="refresh">
        refresh
        <input id="refresh" type="number" step="0.5" inputmode="decimal"
               aria-label="Seconds between refreshes">
        <span>s</span>
      </label>
      <button class="btn theme" id="theme" type="button">
        theme <b id="theme-now">system</b>
      </button>
    </header>

    <main class="body">
      <div class="a-main">
        <div class="tabs" role="tablist" id="view-tabs" aria-label="Dashboard views">

             aria-label="Repository, plan, services, code graph, hooks and actions">

<script id="rt-view-config" type="application/json">__RT_VIEW_CONFIG__</script>
<script>
"use strict";
/* Every number below that a person might want to change arrives in this block,
   substituted by the server out of observe-config.json (R0). */
var CFG = JSON.parse(document.getElementById("rt-view-config").textContent);
var TOKEN = "__RT_SESSION_TOKEN__";
var REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- copy -----------------------------------------------------------------
   The state vocabulary IS this page's product, so it is written once, here,
   rather than invented at each call site. Each entry: the two-letter drafting
   code that carries the state without colour, and what the state means in the
   reader's terms rather than the generator's. */
var STATES = {
  "ok":        { code: "",   label: "ok",        means: "present, and it matches its source" },
  "by-design": { code: "BD", label: "by design", means: "skipped on purpose, and the policy says which rule skips it" },
  "stubbed":   { code: "ST", label: "stubbed",   means: "a pointer stands in for the body, which is over this harness's size ceiling" },
  "trimmed":   { code: "TR", label: "trimmed",   means: "present with a shortened description, to fit this harness's list budget" },
  "stale":     { code: "SL", label: "stale",     means: "present, but the source changed after it was written" },
  "lost":      { code: "LO", label: "lost",      means: "missing, with no reason on record. Regenerate the mirrors" },
  "orphan":    { code: "OR", label: "orphan",    means: "a mirror with no canonical source behind it" },
  "unknown":   { code: "??", label: "unknown",   means: "this harness is not installed here, so its cells cannot be judged" }
};
var STATE_ORDER = ["ok", "by-design", "stubbed", "trimmed", "stale", "lost",
                   "orphan", "unknown"];
var PROBLEM_STATES = { "lost": 1, "stale": 1, "orphan": 1 };

var SOURCE_ORDER = ["agents", "skills", "commands", "rules"];
var SOURCE_LABEL = {
  agents: "Agents", skills: "Skills", commands: "Commands", rules: "Rules",
  repo: "Whole-repo files"
};
/* Harness names, shortened for a column head that must not wrap. */
var HARNESS_SHORT = {
  "GitHub Copilot": "Copilot",
  "GitHub Copilot CLI": "Copilot CLI",
  "VS Code user profile": "VS Code user",
  "any AGENTS.md reader": "AGENTS.md readers"
};

/* ---- reconciler ----------------------------------------------------------
   A poll must repaint values, not rebuild the page. Every render function below
   builds into a DETACHED container and hands it here; this walks the live tree
   against that and writes only what actually differs.

   What that buys, beyond the flicker: a node that is not replaced keeps its
   scroll offset, its focus and any text selection inside it. The MCP roster and
   the hooks pane are both scrollable and were losing their position every two
   seconds. */
function morphAttrs(live, next) {
  var i, attr;
  for (i = live.attributes.length - 1; i >= 0; i -= 1) {
    attr = live.attributes[i];
    if (!next.hasAttribute(attr.name)) { live.removeAttribute(attr.name); }
  }
  for (i = 0; i < next.attributes.length; i += 1) {
    attr = next.attributes[i];
    if (live.getAttribute(attr.name) !== attr.value) {
      live.setAttribute(attr.name, attr.value);
    }
  }
}

function morph(live, next) {
  var a = live.firstChild;
  var b = next.firstChild;
  while (a && b) {
    var afterA = a.nextSibling;
    var afterB = b.nextSibling;
    if (a.nodeType !== b.nodeType
        || (a.nodeType === 1 && a.nodeName !== b.nodeName)) {
      live.replaceChild(b, a);
    } else if (a.nodeType === 3) {
      if (a.nodeValue !== b.nodeValue) { a.nodeValue = b.nodeValue; }
    } else if (a.nodeType === 1) {
      morphAttrs(a, b);
      morph(a, b);
    }
    a = afterA;
    b = afterB;
  }
  while (a) {
    var drop = a;
    a = a.nextSibling;
    live.removeChild(drop);
  }
  while (b) {
    var add = b;
    b = b.nextSibling;
    live.appendChild(add);
  }
}

function stage() { return document.createElement("div"); }

/* ---- tabs ----------------------------------------------------------------
   Two independent strips, one implementation. Which tab is in front is a
   per-viewer convenience, so it lives in a module variable plus localStorage -
   never in the markup, which the poll morphs, and never on the server, which
   serves every viewer the same page.

   The rail list is declared HERE rather than beside its renderers because two
   places name these six panels - the static buttons in the markup and the
   renderer that builds them - and a third copy is how a tab starts pointing at
   a panel nobody builds. The suite compares the two that remain. */
var VIEW_TABS = ["matrix", "canvas", "fleet", "live"];
var RAIL_TABS = [
  { id: "repo", label: "Repository",
    build: function (state) { return renderRepoPanel(state); } },
  { id: "plan", label: "Plan",
    build: function (state) { return renderPlanPanel(state); } },
  { id: "services", label: "Services",
    build: function (state) { return renderServicesPanel(state); } },
  { id: "graph", label: "Code graph",
    build: function (state) { return renderGraphPanel(state); } },
  { id: "hooks", label: "Hooks",
    build: function (state) { return renderHooksPanel(state); } },
  { id: "actions", label: "Actions",
    build: function () { return renderActionsPanel(); } }
];
var VIEW_KEY = "rt-observe-view";
var RAIL_KEY = "rt-observe-rail";

function storedChoice(key, allowed, fallback) {
  try {
    var saved = window.localStorage.getItem(key);
    return allowed.indexOf(saved) === -1 ? fallback : saved;
  } catch (error) {
    /* Same contract as the theme control: a private window, cleared site data
       or a browser set to block storage THROWS on read rather than returning
       null. A tab strip must never be able to break the page it sits on. */
    return fallback;
  }
}

function remember(key, value) {
  try {
    window.localStorage.setItem(key, value);
  } catch (error) {
    /* Not persisted, still applied for this view. */
  }
}

var railIds = RAIL_TABS.map(function (tab) { return tab.id; });
var viewTab = storedChoice(VIEW_KEY, VIEW_TABS, "matrix");
var railTab = storedChoice(RAIL_KEY, railIds, "repo");

function applyViewTab() {
  VIEW_TABS.forEach(function (name) {
    var pane = document.getElementById("pane-" + name);
    var button = document.getElementById("tab-" + name);
    var on = name === viewTab;
    if (pane) { pane.dataset.active = on ? "1" : "0"; }
    if (button) {
      button.setAttribute("aria-selected", on ? "true" : "false");
      button.tabIndex = on ? 0 : -1;
    }
  });
  /* The canvas is MEASURED, not styled. A pane that is display:none is zero
     wide, so a diagram solved while hidden would be cached under a shape that
     describes no width at all and reused the moment its tab came back. Discard
     the cache and solve again, now that there is a width to solve for. */
  if (viewTab === "canvas" && lastState) {
    sim.shape = null;
    renderCanvas(lastState);
  }
}

function setViewTab(name) {
  if (VIEW_TABS.indexOf(name) === -1) { return; }
  viewTab = name;
  remember(VIEW_KEY, name);
  applyViewTab();
}

function applyRailTab() {
  RAIL_TABS.forEach(function (tab) {
    var button = document.getElementById("rtab-" + tab.id);
    if (!button) { return; }
    var on = tab.id === railTab;
    button.setAttribute("aria-selected", on ? "true" : "false");
    button.tabIndex = on ? 0 : -1;
  });
  var rail = document.getElementById("rail");
  if (rail) { rail.setAttribute("aria-labelledby", "rtab-" + railTab); }
  var panels = rail ? rail.querySelectorAll(".rail-panel") : [];
  for (var i = 0; i < panels.length; i += 1) {
    panels[i].dataset.active =
      (panels[i].dataset.rail === railTab) ? "1" : "0";
  }
}

function setRailTab(name) {
  if (railIds.indexOf(name) === -1) { return; }
  railTab = name;
  remember(RAIL_KEY, name);
  applyRailTab();
}

document.addEventListener("click", function (event) {
  if (!event.target.closest) { return; }
  var view = event.target.closest("[data-view]");
  if (view) { setViewTab(view.dataset.view); return; }
  var rail = event.target.closest("[data-rail-tab]");
  if (rail) { setRailTab(rail.dataset.railTab); }
});

document.addEventListener("keydown", function (event) {
  /* Arrow keys inside a tablist, which is what role="tablist" promises a
     screen reader and what a keyboard-only operator reaches for first. */
  if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") { return; }
  var button = event.target.closest && event.target.closest(".tab");
  if (!button) { return; }
  var tabs = [].slice.call(button.parentNode.querySelectorAll(".tab"));
  var step = event.key === "ArrowRight" ? 1 : tabs.length - 1;
  var next = tabs[(tabs.indexOf(button) + step) % tabs.length];
  if (!next) { return; }
  event.preventDefault();
  if (next.dataset.view) { setViewTab(next.dataset.view); }
  if (next.dataset.railTab) { setRailTab(next.dataset.railTab); }
  next.focus();
});

function txt(node, value) {
  var text = (value === null || value === undefined) ? "" : String(value);
  if (node.textContent !== text) { node.textContent = text; }
}

/* ---- small helpers ------------------------------------------------------- */
function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) { node.className = cls; }
  if (text !== undefined && text !== null) { node.textContent = String(text); }
  return node;
}
function short(name) { return HARNESS_SHORT[name] || name; }
function firstSentence(text) {
  var stop = String(text).indexOf(". ");
  return stop === -1 ? String(text) : String(text).slice(0, stop + 1);
}
function clock(stamp) {
  if (!stamp) { return "never"; }
  var m = /T(\d\d:\d\d:\d\d)/.exec(stamp);
  return m ? m[1] : stamp;
}
function duration(seconds) {
  if (seconds === null || seconds === undefined) { return "-"; }
  var s = Math.round(seconds);
  if (s < 60) { return s + " s"; }
  if (s < 3600) { return Math.round(s / 60) + " min"; }
  if (s < 86400) { return Math.round(s / 3600) + " h"; }
  return Math.round(s / 86400) + " d";
}
function titleBlock(host, fields, stale) {
  var next = stage();
  fields.forEach(function (pair) {
    if (pair[1] === null || pair[1] === undefined) { return; }
    var box = el("div");
    box.appendChild(el("span", null, pair[0]));
    box.appendChild(el("b", "rc", pair[1]));
    next.appendChild(box);
  });
  var name = "tblock" + (stale ? " tblock--stale" : "");
  if (host.className !== name) { host.className = name; }
  morph(host, next);
}
function receiptFor(state, name) {
  var r = (state.receipts || {})[name] || {};
  return [["collected", clock(r.collected_at)],
          ["age", duration(r.age_seconds)],
          ["refresh", r.ttl_seconds !== undefined ? r.ttl_seconds + " s" : null]];
}
function unavailable(host, title, section) {
  /* "Collecting" and "unavailable" are different states and must not share a
     word: the first resolves by itself on the next poll, the second does not.
     Measured on the first rendering - the services panel said UNAVAILABLE while
     its first collection was simply still running. */
  var collecting = section.status === "collecting";
  var box = el("div", "unavail");
  box.appendChild(el("b", null, collecting ? "Collecting" : title));
  box.appendChild(document.createTextNode(
    section.reason || "no reason was reported, which is itself the defect"));
  host.appendChild(box);
}

/* ---- matrix -------------------------------------------------------------- */
var prevCellState = {};
var selectedName = null;
var lastMirrors = null;

function cellButton(row, column) {
  var state = row ? row.state.value : "unknown";
  var info = STATES[state] || STATES.unknown;
  var button = el("button", "cell", info.code);
  button.type = "button";
  button.dataset.state = state;
  button.dataset.detail = "cell";
  button.dataset.name = row ? row.name : "";
  button.dataset.target = column.id;
  button.setAttribute("aria-label",
    (row ? row.name : "unknown") + " in " + short(column.harness) + ": "
    + info.label + ". " + info.means
    + (row && row.reason ? " " + row.reason : ""));
  var key = column.id + "|" + (row ? row.name : "");
  if (prevCellState[key] !== undefined && prevCellState[key] !== state) {
    /* Removed by a delegated animationend below rather than a listener on this
       node, which the reconciler is free to reuse or replace. */
    button.classList.add("cell--changed");
  }
  prevCellState[key] = state;
  return button;
}

function columnHead(column, cells) {
  var th = el("th");
  th.scope = "col";
  th.appendChild(document.createTextNode(short(column.harness)));
  var scope = column.scope + (column.requires_flag
    ? " . " + column.requires_flag : "");
  th.appendChild(el("em", null, scope));
  var bad = {};
  cells.forEach(function (row) {
    if (row && PROBLEM_STATES[row.state.value]) {
      bad[row.state.value] = (bad[row.state.value] || 0) + 1;
    }
  });
  var named = Object.keys(bad).sort().map(function (name) {
    return bad[name] + " " + name;
  });
  if (named.length) {
    th.appendChild(el("i", null, named.join(", ")));
  }
  return th;
}

function renderMatrix(state) {
  var liveHost = document.getElementById("mx-scroll");
  var liveLegend = document.getElementById("mx-legend");
  var note = document.getElementById("mx-note");
  var mirrors = state.mirrors || {};
  var host = stage();
  var legend = stage();
  titleBlock(document.getElementById("mx-receipt"), receiptFor(state, "mirrors"),
             false);

  if (mirrors.status !== "ok") {
    txt(note, "");
    unavailable(host, "Matrix unavailable", mirrors);
    morph(liveHost, host);
    morph(liveLegend, legend);
    txt(document.getElementById("mx-detail"), "");
    return;
  }
  lastMirrors = mirrors;

  var totals = mirrors.totals || {};
  var broken = (totals.lost || 0) + (totals.stale || 0) + (totals.orphan || 0);
  txt(note, mirrors.rows.length + " mirrors across "
    + mirrors.columns.length + " dialects. "
    + (broken
        ? broken + (broken === 1 ? " mirror needs" : " mirrors need")
          + " regenerating. Open one to read which command writes it."
        : "Every cell is accounted for."));

  var onlyProblems = document.getElementById("mx-filter").checked;
  var byTarget = {};
  mirrors.rows.forEach(function (row) {
    (byTarget[row.target] = byTarget[row.target] || {})[row.name] = row;
  });

  SOURCE_ORDER.forEach(function (source) {
    var columns = mirrors.columns.filter(function (c) {
      return c.source === source && c.cardinality === "per-definition";
    });
    if (!columns.length) { return; }
    /* Names come from the rows of THESE columns, not from every row that
       shares the source. Continue's single pointer file also has source
       "rules", so taking every rules row put `researchtools.md` in the grid
       with no cell to fill and it rendered as `unknown`. */
    var inGrid = {};
    columns.forEach(function (c) { inGrid[c.id] = 1; });
    var names = {};
    mirrors.rows.forEach(function (row) {
      if (row.source === source && inGrid[row.target]) { names[row.name] = 1; }
    });
    names = Object.keys(names).sort();
    var defined = (mirrors.counts || {})[source];
    var extra = defined === undefined ? 0 : names.length - defined;

    var visible = names.filter(function (name) {
      if (!onlyProblems) { return true; }
      return columns.some(function (c) {
        var row = (byTarget[c.id] || {})[name];
        return row && PROBLEM_STATES[row.state.value];
      });
    });

    var group = el("div", "mx-group");
    /* The canonical count, then the surplus named separately. A single number
       here read as a contradiction of the registry's own count, when what it
       actually showed was mirrors with no canonical source behind them. */
    group.appendChild(el("div", "mx-group-head",
      SOURCE_LABEL[source] + " . " + (defined === undefined ? names.length
        : defined + " defined")
      + (extra > 0 ? " . " + extra + " not in the canonical set" : "")));
    if (!visible.length) {
      group.appendChild(el("div", "mx-detail-empty",
        "Nothing lost, stale or orphaned here."));
      host.appendChild(group);
      return;
    }
    var table = el("table", "mx");
    var thead = el("thead");
    var hrow = el("tr");
    var corner = el("th");
    corner.scope = "col";
    hrow.appendChild(corner);
    columns.forEach(function (c) {
      var cells = names.map(function (n) { return (byTarget[c.id] || {})[n]; });
      hrow.appendChild(columnHead(c, cells));
    });
    thead.appendChild(hrow);
    table.appendChild(thead);

    var tbody = el("tbody");
    visible.forEach(function (name) {
      var tr = el("tr");
      var th = el("th", null, name);
      th.scope = "row";
      tr.appendChild(th);
      columns.forEach(function (c) {
        var td = el("td");
        td.appendChild(cellButton((byTarget[c.id] || {})[name], c));
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    group.appendChild(table);
    host.appendChild(group);
  });

  if (!host.children.length) {
    /* Rows exist but no group matched a source: a policy that declares no
       per-definition target at all is a real configuration, and a blank panel
       would read as a broken page. */
    host.appendChild(el("div", "mx-detail-empty",
      "No per-definition dialect is declared in mirror-policy.json, so there "
      + "is no grid to draw. The single-file targets below still apply."));
  }
  var singles = mirrors.columns.filter(function (c) {
    return c.cardinality === "single-file";
  });
  if (singles.length) {
    var box = el("div", "mx-single");
    box.appendChild(el("div", "mx-group-head",
      "Single-file targets . " + singles.length));
    var list = el("ul");
    singles.forEach(function (c) {
      var rows = mirrors.rows.filter(function (r) { return r.target === c.id; });
      var row = rows[0];
      var li = el("li");
      li.appendChild(cellButton(row, c));
      li.appendChild(el("b", null, short(c.harness)));
      /* These rows carry `name` and a `note` holding the design rationale, and
         no `path` at all. Reading path here printed five blank lines. */
      li.appendChild(el("span", "rc", row ? row.name : "-"));
      if (row && (row.note || row.reason)) {
        li.appendChild(el("span", null, firstSentence(row.note || row.reason)));
      }
      list.appendChild(li);
    });
    box.appendChild(list);
    host.appendChild(box);
  }

  STATE_ORDER.forEach(function (name) {
    var info = STATES[name];
    var count = totals[name];
    var item = el("div");
    var swatch = el("button", "cell", info.code);
    swatch.type = "button";
    swatch.tabIndex = -1;
    swatch.setAttribute("aria-hidden", "true");
    swatch.dataset.state = name;
    item.appendChild(swatch);
    item.appendChild(el("b", null, info.label));
    item.appendChild(document.createTextNode(
      count === undefined ? info.means : count + " . " + info.means));
    legend.appendChild(item);
  });
  morph(liveHost, host);
  morph(liveLegend, legend);

  renderDetail(selectedName);
}

function renderDetail(name) {
  var live = document.getElementById("mx-detail");
  var host = stage();
  if (!lastMirrors) { return; }
  if (!name) {
    host.appendChild(el("div", "mx-detail-empty",
      "Pick any cell to read its receipt: what proved that state, when, and why."));
    morph(live, host);
    return;
  }
  var rows = lastMirrors.rows.filter(function (r) { return r.name === name; });
  if (!rows.length) {
    host.appendChild(el("div", "mx-detail-empty",
      name + " has no mirrors on record."));
    morph(live, host);
    return;
  }
  var byId = {};
  lastMirrors.columns.forEach(function (c) { byId[c.id] = c; });
  host.appendChild(el("h3", null, name));
  var table = el("table");
  var thead = el("thead");
  var head = el("tr");
  ["dialect", "state", "why", "path", "proven"].forEach(function (h) {
    var th = el("th", null, h);
    th.scope = "col";
    head.appendChild(th);
  });
  thead.appendChild(head);
  table.appendChild(thead);
  var body = el("tbody");
  rows.forEach(function (row) {
    var column = byId[row.target] || { harness: row.target, scope: "" };
    var info = STATES[row.state.value] || STATES.unknown;
    var tr = el("tr");
    tr.appendChild(el("td", null, short(column.harness) + " . " + column.scope));
    tr.appendChild(el("td", null, info.label));
    tr.appendChild(el("td", "why", row.reason || info.means));
    var path = el("td");
    path.appendChild(el("span", "rc", row.path || "-"));
    tr.appendChild(path);
    var proven = el("td");
    proven.appendChild(el("span", "rc",
      row.state.proven_by + " . " + clock(row.state.proven_at)));
    tr.appendChild(proven);
    body.appendChild(tr);
  });
  table.appendChild(body);
  host.appendChild(table);
  morph(live, host);
}

/* ---- tooltip ------------------------------------------------------------- */
var tip = document.getElementById("tip");
/* ---- the hover detail layer, written once --------------------------------
   Part G of the plan. Any box, any edge, any cell that can explain itself
   carries data-detail="<kind>" plus whatever key its provider needs. A provider
   returns { title, means, pairs, note } and the ONE renderer below draws it.

   Written once on purpose rather than per panel: the fan-out edge that reads
   `1 lost` and the matrix cell that reads `LO` are two views of one fact, and
   two tooltip implementations are two chances to explain that fact differently.
   The worked example the plan names is the edge - it said `1 lost` and WHICH
   mirror was lost could not be reached from it at all. */
var DETAIL = {};

function registerDetail(kind, provide) { DETAIL[kind] = provide; }

function showDetail(host) {
  var provide = DETAIL[host.dataset.detail];
  if (!provide) { return; }
  var found = provide(host);
  if (!found) { return; }
  tip.textContent = "";
  tip.appendChild(el("b", null, found.title));
  if (found.means) { tip.appendChild(document.createTextNode(found.means)); }
  (found.pairs || []).forEach(function (pair) {
    var line = el("div", "tip-line");
    line.appendChild(el("span", null, pair[0]));
    line.appendChild(el("em", null, pair[1]));
    tip.appendChild(line);
  });
  if (found.note) { tip.appendChild(el("em", null, " " + found.note)); }
  placeTip(host);
}

function placeTip(host) {
  /* Works for an HTML element and for an SVG node alike, which is the point of
     measuring the rendered box rather than reading coordinates out of either. */
  var box = host.getBoundingClientRect();
  tip.dataset.show = "1";
  var width = tip.offsetWidth;
  var left = Math.min(box.left, window.innerWidth - width - 8);
  var top = box.bottom + 6;
  if (top + tip.offsetHeight > window.innerHeight) {
    top = box.top - tip.offsetHeight - 6;
  }
  tip.style.left = Math.max(4, left) + "px";
  tip.style.top = Math.max(4, top) + "px";
}

function hideTip() { tip.dataset.show = "0"; }

function detailHost(event) {
  var node = event.target.closest && event.target.closest("[data-detail]");
  return (node && !node.hasAttribute("aria-hidden")) ? node : null;
}

document.addEventListener("pointerover", function (event) {
  var host = detailHost(event);
  if (host) { showDetail(host); }
});
document.addEventListener("pointerout", function (event) {
  if (detailHost(event)) { hideTip(); }
});
document.addEventListener("focusin", function (event) {
  var host = detailHost(event);
  if (host) { showDetail(host); }
});
document.addEventListener("focusout", hideTip);

registerDetail("cell", function (host) {
  var info = STATES[host.dataset.state] || STATES.unknown;
  var row = lastMirrors && lastMirrors.rows.filter(function (r) {
    return r.name === host.dataset.name && r.target === host.dataset.target;
  })[0];
  return { title: info.label, means: info.means,
           pairs: [["mirror", host.dataset.name || "unknown"]],
           note: row ? row.reason : "" };
});

registerDetail("note", function (host) {
  /* The generic one: a box whose whole detail is a sentence it already holds,
     and optionally a LIST - what an outbox is holding, what a snapshot counts.
     It exists so that a panel with one thing to say does not grow a tooltip
     implementation of its own. */
  var pairs = [];
  (host.dataset.detailLines || "").split("|").forEach(function (line) {
    if (!line) { return; }
    var cut = line.indexOf(" ");
    pairs.push(cut === -1 ? [line, ""]
                          : [line.slice(0, cut), line.slice(cut + 1)]);
  });
  return { title: host.dataset.detailTitle || "detail",
           means: host.dataset.detailNote || "",
           pairs: pairs };
});

registerDetail("phase", function (host) {
  var phase = ((lastState || {}).progress || {}).phases || [];
  var found = phase.filter(function (p) {
    return String(p.number) === host.dataset.detailKey;
  })[0];
  if (!found) { return null; }
  return { title: found.label, means: "",
           pairs: [["state", found.state]],
           note: found.evidence
             || "no evidence recorded, so this phase is ticked and unproven" };
});

registerDetail("gnode", function (host) {
  var node = graphNode(host.dataset.detailKey);
  if (!node) { return null; }
  var pairs = [];
  if (node.count !== null && node.count !== undefined) {
    pairs.push([node.id.indexOf("src:") === 0 ? "defined" : "count",
                String(node.count)]);
  }
  var broken = 0;
  var total = 0;
  ((sim.graph || {}).edges || []).forEach(function (edge) {
    if (edge.from !== node.index && edge.to !== node.index) { return; }
    total += edge.count;
    broken += edge.broken;
  });
  if (total) { pairs.push(["mirrors", String(total)]); }
  if (broken) { pairs.push(["needing work", String(broken)]); }
  return { title: node.label,
           means: LANE_NAMES[node.lane] ? LANE_NAMES[node.lane].toLowerCase() : "",
           pairs: pairs,
           note: node.absent ? "not installed on this machine"
             : (broken ? "hover the red edge for which ones" : "") };
});

registerDetail("gedge", function (host) {
  var edge = graphEdge(host.dataset.detailKey);
  if (!edge) { return null; }
  var graph = sim.graph || { nodes: [] };
  var from = graph.nodes[edge.from] || {};
  var to = graph.nodes[edge.to] || {};
  var pairs = (edge.problems || []).slice(0, CFG.detail_rows).map(
    function (problem) {
      return [problem.state, problem.name];
    });
  var hidden = (edge.problems || []).length - pairs.length;
  return { title: (from.label || "?") + " to " + (to.label || "?"),
           means: edge.kind === "mirror"
             ? edge.count + " mirrors, " + edge.broken + " needing work"
             : "consumed directly, with no mirror in between",
           pairs: pairs,
           note: hidden > 0 ? "and " + hidden + " more" : "" };
});

function graphNode(id) {
  var nodes = (sim.graph || {}).nodes || [];
  return nodes.filter(function (n) { return n.id === id; })[0];
}

function graphEdge(key) {
  var edges = (sim.graph || {}).edges || [];
  return edges.filter(function (e) { return e.key === key; })[0];
}

/* ---- dragging ------------------------------------------------------------
   Defined for the objects that HAVE edges, which is the diagram's boxes: the
   panels are the sheet itself and moving one would only break the promise that
   the whole dashboard fits the screen.

   The edges follow for free, and that is a property of the drawing rather than
   a feature: a path is emitted FROM the node coordinates every time, so there
   is no second copy of the geometry that could fall out of step. */
var dragging = null;

function svgScale(svg) {
  var box = svg.getBoundingClientRect();
  var view = (svg.getAttribute("viewBox") || "0 0 1 1").split(" ");
  return { x: parseFloat(view[2]) / (box.width || 1),
           y: parseFloat(view[3]) / (box.height || 1) };
}

function clamp(value, low, high) {
  return Math.max(low, Math.min(high, value));
}

document.addEventListener("pointerdown", function (event) {
  var group = event.target.closest && event.target.closest("svg.fanout .node");
  if (!group || !sim.graph || !sim.dims) { return; }
  var node = graphNode(group.dataset.detailKey);
  if (!node) { return; }
  var svg = document.getElementById("fanout");
  /* A movement in flight is superseded by a hand on the box. */
  window.cancelAnimationFrame(sim.raf);
  sim.tweening = false;
  svg.classList.add("rt-dragging");
  dragging = { node: node, svg: svg, fromX: event.clientX,
               fromY: event.clientY, wasX: node.x, wasY: node.y };
  event.preventDefault();
});

document.addEventListener("pointermove", function (event) {
  if (!dragging) { return; }
  var scale = svgScale(dragging.svg);
  var dims = sim.dims;
  var node = dragging.node;
  node.x = clamp(dragging.wasX + (event.clientX - dragging.fromX) * scale.x,
                 node.w / 2 + 2, dims.width - node.w / 2 - 2);
  node.y = clamp(dragging.wasY + (event.clientY - dragging.fromY) * scale.y,
                 node.h / 2 + 2, dims.height - node.h / 2 - 2);
  /* Held, so the two-second poll does not put the box back where the solver
     wanted it: the unchanged-shape path restores every node from here. */
  if (sim.positions) { sim.positions[node.id] = { x: node.x, y: node.y }; }
  drawGraph(sim.graph, dragging.svg, dims.width, dims.height, dims.vertical);
});

document.addEventListener("pointerup", function () {
  if (!dragging) { return; }
  dragging.svg.classList.remove("rt-dragging");
  dragging = null;
});
document.addEventListener("click", function (event) {
  var button = event.target.closest && event.target.closest(".cell");
