                  - link "Pictogramme – Assistance majeure (500 x 204 px) → Télécharger" [ref=e129] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KELNDr97K1cJk6HOFCI6jmYiS2o-GSLn
                - paragraph [ref=e130]:
