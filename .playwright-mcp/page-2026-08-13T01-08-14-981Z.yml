    - heading "Pictogrammes de déclaration des niveaux d’utilisation de l’intelligence artificielle générative (IAg)" [level=1] [ref=e41]
    - generic [ref=e43]:
      - main [ref=e44]:
        - article [ref=e45]:
          - generic [ref=e46]:
            - heading [level=2] [ref=e47]:
              - strong [ref=e48]: Pictogrammes de déclaration des niveaux d’utilisation de l’intelligence artificielle générative (IAg)
            - paragraph [ref=e49]
            - table [ref=e50]:
              - rowgroup [ref=e51]:
                - row [ref=e52]:
                  - cell [ref=e53]
                  - cell [ref=e54]:
                    - heading "Avec l’essor de l’intelligence artificielle générative (IAg), il devient utile de clarifier son rôle dans la production de contenus. Dans un souci de transparence et de responsabilité, l’équipe pédagogique de l’accompagnement pédagogique en technologies éducatives (APTE) de l’UQAC a mis en place un système de pictogrammes permettant d’indiquer le niveau d’utilisation de l’IAg dans les productions." [level=6] [ref=e55]
            - heading [level=5]
            - link "> Télécharger l’infographie" [ref=e57] [cursor=pointer]:
              - /url: https://drive.google.com/file/d/1PZIdCwQbw43oQqSbpnL5HbQmpBw3j_t1/view?usp=sharing
            - paragraph [ref=e58]
            - heading [level=5]
            - heading "Pourquoi ce système ?" [level=5] [ref=e59]
            - paragraph [ref=e60]: En utilisant ces pictogrammes dans les productions, nous renforçons la précision et la transparence quant à l’implication de l’IAg.
            - paragraph [ref=e61]: "Cela permet de :"
            - list [ref=e62]:
              - listitem [ref=e63]:
                - strong [ref=e64]: Mieux informer les utilisateurs
                - text: sur les spécificités de l’utilisation de l’IAg.
              - listitem [ref=e65]:
                - strong [ref=e66]: Encourager la clarté et la responsabilité
                - text: dans la production des contenus.
              - listitem [ref=e67]:
                - strong [ref=e68]: Différencier les niveaux et types d’interventions
                - text: pour une meilleure compréhension des pratiques employées.
            - heading [level=5]
            - heading "Comment utiliser ?" [level=5] [ref=e69]
            - paragraph [ref=e70]: "Nous vous proposons de :"
            - list [ref=e71]:
              - listitem [ref=e72]:
                - strong [ref=e73]: Choisir
                - text: dans cette page le pictogramme reflétant votre utilisation.
              - listitem [ref=e74]:
                - strong [ref=e75]: Télécharger
                - text: le format désiré (normal ou compact) et le
                - strong [ref=e76]: placer dans votre production.
              - listitem [ref=e77]:
                - text: Lorsque possible,
                - strong [ref=e78]: "faire pointer vers cette page:"
                - text: ( https://www.uqac.ca/ressourcespedago/iag/ ).
              - listitem [ref=e79]: Si vous le souhaitez, vous pouvez ajouter une explication de votre utilisation sous le pictogramme choisi, mais cela reste entièrement facultatif.
            - paragraph [ref=e80]
            - heading "Voici les détails des quatre niveaux:" [level=5] [ref=e81]
            - generic [ref=e82]:
              - generic [ref=e83]:
                - paragraph [ref=e84]:
                  - strong [ref=e85]: 1. Aucune utilisation d’IAg
                  - text: "Nom du pictogramme :"
                  - emphasis [ref=e86]: Aucune utilisation
                - paragraph [ref=e87]: "Format compact :"
                - paragraph [ref=e88]: La production n’a bénéficié d’aucune intervention de l’IAg, que ce soit pour le texte ou les images.
                - paragraph [ref=e89]:
                  - link "Pictogramme – Aucune utilisation (200 x 82 px) → Télécharger" [ref=e90] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KPD8p0mmLmbwkML8VhJAz69WrvAgHoVb
                  - link "Pictogramme – Aucune utilisation (500 x 204 px) → Télécharger" [ref=e91] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KH_CSkswanb0rg48Dh9WRVXWMn7-920y
                - paragraph [ref=e92]:
                  - text: "Format compact :"
                  - link "Compact – Aucune utilisation (200 x 82 px) → Télécharger" [ref=e93] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KU_JU0cSxtePwkLVyBq6BdprugyhR3Lm
                  - link "Compact – Aucune utilisation (272 x 152 px) → Télécharger" [ref=e94] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1JvTwTWB33_hFrE4dNsYr-ILlnEdQuAvz
              - generic [ref=e95]:
                - paragraph [ref=e96]:
                  - strong [ref=e97]: 2. Assistance limitée de l’IAg
                  - text: "Nom du pictogramme :"
                  - emphasis [ref=e98]: Assistance limitée
                - paragraph [ref=e99]: "Format compact :"
                - paragraph [ref=e100]: L’IA générative a été utilisée uniquement pour des suggestions ou des corrections mineures (orthographe, grammaire) ainsi que pour l’amélioration d’éléments visuels, tels que l’ajout d’un titre ou d’une légende, ou encore la traduction d’éléments présents dans une image.
                - paragraph [ref=e101]:
                  - link "Pictogramme – Assistance limitée (200 x 82 px) → Télécharger" [ref=e102] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KOpCg1hSwNzdgofM2mpKDHrLXAtABKEg
                  - link "Pictogramme – Assistance limitée (500 x 204 px) → Télécharger" [ref=e103] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KHDP-kS8-v-rXM5CI4ocpHe5nHT0Q8l8
                - paragraph [ref=e104]:
                  - text: "Format compact :"
                  - link "Compact – Assistance limitée (200 x 82 px) → Télécharger" [ref=e105] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KQAg5MpYnCiYo2uyxHhAw5e773uPV2b5
                  - link "Compact – Assistance limitée (272 x 152 px) → Télécharger" [ref=e106] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1JulKHxBXp1tkZy0D1i4caxLHFOdOsevH
            - separator [ref=e107]
            - generic [ref=e108]:
              - generic [ref=e109]:
                - paragraph [ref=e110]:
                  - strong [ref=e111]: 3. Production partagée avec l’IAg
                  - text: "Nom du pictogramme :"
                  - emphasis [ref=e112]: Assistance partagée
                - paragraph [ref=e113]: "Format compact :"
                - paragraph [ref=e114]: Une contribution significative de l’IA générative est observée dans la création des contenus. Ces derniers ont été élaborés en partenariat avec l’IA générative, qui a joué un rôle important. Le contenu textuel a été en partie généré ou reformulé par celle-ci, tandis que les éléments visuels ont été majoritairement produits ou modifiés grâce à son intervention.
                - paragraph [ref=e115]:
                  - link "Pictogramme – Assistance partagée (200 x 82 px) → Télécharger" [ref=e116] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KIzUjOF4HU0SfMDHApqpD1htnykJm2Sh
                  - link "Pictogramme – Assistance partagée (500 x 204 px) → Télécharger" [ref=e117] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1K8y04gllO70HON9wwd_BlI6QgvQOmP4N
                - paragraph [ref=e118]:
                  - text: "Format compact :"
                  - link "Compact – Assistance partagée (200 x 82 px) → Télécharger" [ref=e119] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1KPUcZsG8sACU_CxL2zp-UKmE5gusr_gl
                  - link "Compact – Assistance partagée (272 x 152 px) → Télécharger" [ref=e120] [cursor=pointer]:
                    - /url: https://drive.google.com/uc?export=download&id=1JsRwfTiDcQ-C1sX8G1H7X5iG5x76xt60
              - generic [ref=e121]:
                - paragraph [ref=e122]:
                  - strong [ref=e123]: 4. Production majoritairement assistée
                  - text: "Nom du pictogramme :"
                  - emphasis [ref=e124]: Assistance majeure
                - paragraph [ref=e125]: "Format compact :"
                - paragraph [ref=e126]: Les contenus sont principalement le fruit d’un travail automatisé par l’IAg, avec une intervention humaine minimale (presque intégralement généré par l’IAg).
                - paragraph [ref=e127]:
                  - link "Pictogramme – Assistance majeure (200 x 82 px) → Télécharger" [ref=e128] [cursor=pointer]:
