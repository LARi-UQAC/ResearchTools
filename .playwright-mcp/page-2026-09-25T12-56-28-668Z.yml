          - heading [level=3] [ref=e173]: 3. Écriture persuasive
          - paragraph [ref=e176]: L'écriture persuasive consiste à faire passer votre message. Le but est de partager votre opinion de manière réfléchie ou, mieux encore, de convaincre le lecteur d'un point de vue ou d'une idée. Que vous ayez une position ferme sur une question ou que vous ayez besoin d'inciter le public à agir pour une cause, l'écriture persuasive est le moyen d'y parvenir.
          - paragraph [ref=e179]: "Bien entendu, vous ne pouvez pas vous contenter d'énoncer votre point de vue pour convaincre tout le monde, vous devez l'étayer efficacement pour rallier le lecteur à votre cause. Il existe plusieurs types principaux de moyens de persuasion que vous pouvez utiliser à l'écrit :"
          - list [ref=e180]:
            - listitem [ref=e181]: Des preuves statistiques, telles que des faits concrets ou des études
            - listitem [ref=e182]: Des preuves anecdotiques, telles que des expériences personnelles ou des interviews
            - listitem [ref=e183]: Des témoignages, tels que des citations d'experts en la matière
            - listitem [ref=e184]: Des documents écrits, tels que des passages de livres ou des sources primaires
          - paragraph [ref=e187]: "Quelles que soient les preuves utilisées, il est souvent préférable de ne pas se laisser emporter par ses sentiments dans un texte persuasif. Si le fait de dévoiler un pan de votre expérience personnelle peut vous aider à construire un argumentaire convaincant, trop d'émotion risque de brouiller vos arguments clés et de rebuter le lecteur. Au lieu de cela, essayez de vous mettre à la place du lecteur et demandez-vous : Quelles sont les principales informations susceptibles de les convaincre ?"
          - heading [level=4] [ref=e189]: Quand recourir à l'écriture persuasive
          - paragraph [ref=e192]: "L'écriture persuasive se retrouve souvent dans les œuvres de non-fiction et n'est presque jamais utilisée dans les œuvres de fiction. Elle mérite d'être maîtrisée si vous rédigez des documents professionnels, ne serait-ce que des e-mails destinés à vos collègues, car convaincre clairement les gens de vos idées ou de votre point de vue peut s'avérer très utile au travail. Vous verrez également que l'écriture persuasive est utilisée dans le type d'écrits suivants :"
          - list [ref=e193]:
            - listitem [ref=e194]: Essais
            - listitem [ref=e195]: Op-eds
            - listitem [ref=e196]: Discours ou présentations
            - listitem [ref=e197]:
