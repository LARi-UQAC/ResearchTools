          - heading [level=3] [ref=e217]: 4. Écrite expositoire
          - paragraph [ref=e220]: L'écriture expositoire a pour but d'expliquer un sujet ou d'informer sur un domaine particulier. Le but est simplement d'apprendre quelque chose au lecteur.
          - paragraph [ref=e223]: "L'écriture expositoire doit viser à répondre à toutes les questions qu'un lecteur peut se poser sur un sujet : pensez aux questions classiques qui, quoi, pourquoi, quand et comment. Vous devez présenter les choses clairement, en évitant tout jargon ou tout langage trop technique qui pourrait être source de confusion. Essayez vous d'aborder à l'écriture expositoire avec la mentalité d'un débutant pour rendre votre article aussi utile que possible."
          - paragraph [ref=e226]: Le plus important est de ne pas exprimer vos émotions et vos opinions sur un sujet. Contrairement à l'écriture persuasive, l'écriture expositoire ne doit pas avoir d'angle ou d'ordre du jour, elle doit simplement présenter les faits.
          - heading [level=4] [ref=e228]: Quand recourir à l'écriture expositoire
          - paragraph [ref=e231]: "Apprendre à écrire dans ce style vous servira si vous devez un jour enseigner par écrit, même s'il s'agit seulement de former votre collègue à un processus particulier. Si, historiquement, l'écriture expositoire était surtout considérée comme un style académique, elle est aujourd'hui omniprésente sur le web, notamment sur les blogs consacrés au marketing de contenu et dans les articles didactiques qui enseignent aux lecteurs comment maîtriser toutes sortes de compétences. Par exemple, vous retrouverez l'écriture expositoire dans :"
          - list [ref=e232]:
            - listitem [ref=e233]: Des articles didactiques
            - listitem [ref=e234]: Des articles de centre d'aide, des pages FAQ ou d'autres textes expliquant le fonctionnement d'un produit
            - listitem [ref=e235]: Des manuels scolaires
            - listitem [ref=e236]: Écriture technique ou commerciale
            - listitem [ref=e237]: Matériel de formation
          - heading [level=4] [ref=e239]: Exemples d'écriture expositoire
          - paragraph [ref=e242]: "Cet article de blog est un exemple classique d'écriture expositoire, il est rédigé pour partager des faits et vous apprendre quelque chose ! En outre, vous trouverez ici d'autres exemples d'écriture expositoire :"
          - list [ref=e243]:
            - listitem [ref=e244]: Cherchez sur Google « comment faire » et lisez les articles qui apparaissent.
