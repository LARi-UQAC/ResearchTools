          - heading [level=3] [ref=e133]: 2. Écriture descriptive
          - paragraph [ref=e136]: L'écriture descriptive consiste à saisir chaque détail du lieu, de la personne ou de la scène sur lesquels vous écrivez. L'objectif est de plonger le lecteur au cœur du récit, en lui donnant l'impression d'y être.
          - paragraph [ref=e139]:
            - text: "Lorsque vous essayez d'adopter un style d'écriture descriptif, considérez que vous peignez une image avec vos mots. Que pouvez-vous ajouter pour aider le lecteur à se représenter le sujet dans son esprit ? Vous pouvez généralement écrire des descriptions vivantes en utilisant les cinq sens : la vue, l'odorat, l'ouïe, le toucher et le goût. Vous pouvez également avoir recours à"
            - link [ref=e140] [cursor=pointer]:
              - /url: https://www.skillshare.com/classes/Write-Vivid-Narration-Bring-Action-Setting-and-Mood-to-Life/1560384732
              - text: des comparaisons et des métaphores
            - text: pour évoquer une humeur ou un sentiment trop difficile à saisir avec des descriptions physiques. Cela peut aider à transformer une simple description en un texte qui touchera vos lecteurs à un niveau plus profond.
          - paragraph [ref=e143]:
            - text: Selon
            - link [ref=e144] [cursor=pointer]:
              - /url: https://www.skillshare.com/classes/Descriptive-Writing-Crafting-Vivid-Immersive-Scenes/1691098678
              - text: Kathy Fish, enseignante sur Skillshare
            - text: ", l'écriture descriptive ne consiste pas seulement à embellir votre histoire. « Une bonne description remplit quatre objectifs. Elle immerge le lecteur et lui fait vivre une véritable expérience. Elle permet également d'établir, d'améliorer ou de changer le ton de l'histoire. Elle peut pousser le lecteur à avancer dans l'histoire, surtout si vous incluez un élément surprenant ou inattendu dans votre description. Elle peut donner au lecteur une idée de l'état mental de votre personnage. »"
          - heading [level=4] [ref=e146]: Quand recourir à l'écriture descriptive
          - paragraph [ref=e149]: "L'écriture descriptive est le plus souvent utilisée dans l'écriture créative et peut être utilisée avec l'écriture narrative pour construire une scène et un décor. On peut parfois l'utiliser dans des textes plus formels pour expliquer une idée plus en profondeur ou pour amener le lecteur à s'identifier émotionnellement à l'histoire que vous racontez. Voici quelques exemples de situations où vous pouvez utiliser l'écriture descriptive :"
