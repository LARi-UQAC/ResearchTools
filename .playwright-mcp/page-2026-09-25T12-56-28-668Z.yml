          - heading [level=3] [ref=e249]: 5. Écriture créative
          - paragraph [ref=e252]: Comme pour tout moyen d'expression artistique, les règles sont faites pour être transgressées. L'écriture créative englobe toute écriture qui se situe en dehors des styles ci-dessus, ou qui combine ces styles de manière surprenante. Le but de l'écriture créative est vraiment de trouver de nouvelles façons de raconter des histoires qui peuvent surprendre et ravir les lecteurs.
          - paragraph [ref=e255]: Lorsqu'il s'agit d'écriture créative, vous pouvez vous permettre de réécrire littéralement les règles constitutives d'une écriture de qualité. Vous pouvez essayer un nouveau format ou une nouvelle structure que vous n'avez jamais vu auparavant. Vous pouvez intégrer d'autres langues ou des éléments multimédias dans votre travail. Permettez vous de prendre du plaisir !
          - heading [level=4] [ref=e257]: Quand recourir à l'écriture créative
          - paragraph [ref=e260]: "Le but de l'écriture créative est vraiment de vous permettre d'expérimenter avec votre art ! Voici une liste non exhaustive de sources d'inspiration pour l'écriture créative :"
