        - generic [ref=e85]:
          - paragraph [ref=e88]: Devenir un écrivain accompli, pour le travail ou pour le plaisir, ne consiste pas simplement à s'asseoir et à coucher des mots sur le papier. Il existe en fait différents types d'écriture qui répondent à des objectifs différents, et comprendre l'objectif que vous essayez d'atteindre, et la technique qui le servira le mieux, rendra votre travail plus efficace.
          - paragraph [ref=e91]: Vous trouverez ci-dessous des informations sur les cinq styles d'écriture, sur les circonstances dans lesquelles vous devez utiliser chacun d'entre eux et sur la manière d'améliorer vos compétences, quel que soit le type d'écriture que vous souhaitez privilégier.
          - heading [level=2] [ref=e93]: Les 5 styles d'écriture et pourquoi vous devriez maîtriser chacun d'entre eux
          - heading [level=3] [ref=e95]: 1. Écriture narrative
          - paragraph [ref=e98]:
            - text: L'
            - link [ref=e99] [cursor=pointer]:
              - /url: https://www.skillshare.com/blog/5-examples-of-narrative-writing/
              - text: écriture narrative
            - text: "est la narration dans ce qu'elle a de plus fondamental : il s'agit de partager un événement particulier survenu à un personnage. Il peut s'agir d'un récit épique ou d'une petite anecdote, qui peut s'étendre sur des années ou sur quelques minutes, il peut s'agir de faits ou de fiction."
          - paragraph [ref=e102]:
            - text: L'écriture narrative utilise plusieurs des
            - link [ref=e103] [cursor=pointer]:
              - /url: http://skillshare.com/blog/be-memorable-7-elements-of-storytelling-to-master/
              - text: éléments de narration
            - text: les plus courants, tels que l'intrigue, le personnage, le cadre, le conflit, l'émotion et le message central que vous essayez de faire passer. Certains
            - link [ref=e104] [cursor=pointer]:
              - /url: https://www.skillshare.com/classes/Storytelling-for-Leaders-How-to-Craft-Stories-That-Matter/1980968673/projects
              - text: archétypes d'histoire
            - text: ou structures narratives éprouvés peuvent également être utilisés pour façonner votre écriture narrative, comme le passage à l'âge adulte, la quête de richesse ou le périple du héros.
          - paragraph [ref=e107]: "L'écriture narrative peut prendre de nombreuses formes, cependant un principe reste toujours vrai : vous devez embarquer le lecteur dans un voyage avec un début, un milieu et une fin. Même si vous relatez simplement un incident cocasse qui vous est arrivé hier, votre personnage doit commencer quelque part, se heurter à une sorte de conflit ou d'expérience intéressante, et finalement parvenir à trouver une solution."
          - heading [level=4] [ref=e109]: Quand recourir à l'écriture narrative
          - paragraph [ref=e112]: "L'écriture narrative est le plus souvent utilisée dans la fiction et l'écriture créative, mais elle peut également être utilisée dans la non-fiction pour rendre les histoires vraies plus convaincantes pour votre lecteur. Quel que soit votre domaine d'écriture, le style narratif vaut la peine d'être maîtrisé car le public a tendance à s'attacher davantage aux histoires. Par exemple, vous pouvez utiliser l'écriture narrative dans :"
          - list [ref=e113]:
            - listitem [ref=e114]: Les romans et les nouvelles
            - listitem [ref=e115]: Les mémoires
            - listitem [ref=e116]: Les essais créatifs
            - listitem [ref=e117]: Les reportages
            - listitem [ref=e118]: Les présentations ou les discours
