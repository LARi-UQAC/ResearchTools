site_name: ResearchTools
site_description: AI-assisted toolbox for academic writing and software design, built on Claude Code agents/skills/commands.
site_url: https://LARi-UQAC.github.io/ResearchTools/
repo_url: https://github.com/LARi-UQAC/ResearchTools
repo_name: LARi-UQAC/ResearchTools
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy
  logo: manual/banner/LogoLARI_trim.png
  favicon: assets/ResearchToolsLogo.png

# The header and mobile-drawer logo (LAR.i) links to the lab's site rather than this
# site's home page; Material reads extra.homepage for both logo anchors. The Home tab
# still leads back to this site.
extra:
  homepage: https://lari.uqac.ca/
  # Branch that links leaving docs/ point at on the built site (scripts/docs/mkdocs_hooks.py).
  # Chosen 2026-10-17: the live site is deployed from main with `mkdocs gh-deploy`.
  docs_source_ref: main

# Build hook: sends a link to a file outside docs/ to its GitHub page. Source links stay relative.
hooks:
  - scripts/docs/mkdocs_hooks.py

# A dead link or a dead heading anchor is a warning, so `mkdocs build --strict` fails on it.
validation:
  links:
    not_found: warn
  anchors: warn

extra_css:
  - assets/extra.css

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
      # GitHub-style heading ids (a removed dash or slash leaves a double dash), so anchors written
      # for GitHub resolve on the site too.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower

nav:
  - Home: index.md
  - Manual:
      - 00 Purpose & overview: manual/00-purpose.md
      - 01 Installation: manual/01-installation.md
      - 02 Profiles & environment: manual/02-profiles.md
      - 03 Token management: manual/03-token-management.md
      - 04 Commands: manual/04-commands.md
      - 05 Agents: manual/05-agents.md
      - 06 Skills: manual/06-skills.md
      - 07 Hooks and guards: manual/07-hooks.md
      - 08 Rules and conventions: manual/08-rules.md
      - 09 Harnesses and mirrors: manual/09-harnesses.md
      - 10 rt-observe & dashboard: manual/10-rt-observe-dashboard.md
      - 11 Local coding and the cloud: manual/11-local-coding.md
      - 12 PCB design, mixed signals (placeholder): manual/12-pcb-design.md
      - 13 3D CAD design, CNC, 3D printing (placeholder): manual/13-cad-design.md
      - 14 Aider nightly pipeline: manual/14-aider-pipeline.md
      - 15 Security audit and guards: manual/15-security-audit.md
      - 16 Maintenance, checks and CI: manual/16-maintenance.md
      - 17 ThesisTracker integration: manual/17-thesistracker-integration.md
      - 18 File locations: manual/18-file-locations.md
  - Deep-dive references:
      - aider-setup: aider-setup.md
      - rt-observe: rt-observe.md
      - Authoring & mirrors: authoring-and-mirrors.md
      - Contributor notes: contributor-notes.md
      - GitHub repo setup playbook: github-repo-setup-playbook.md

exclude_docs: |
  superpowers/**
